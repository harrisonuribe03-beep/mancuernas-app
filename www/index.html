    if(st.k==='rest'){if(st.d<10)return;const nx=q.steps[i+1];
      if(st.t==='Descanso largo'){const b=/Bloque (\d+)/.exec(st.sub);return speakSegs([VZ.single.seqLong,b?VS.block(+b[1]):''],{full:true});}
      return speakSegs([vpick('sr',VZ.seqRest),nx&&nx.t!=='¡Trabajo!'?VZ.single.seqNext:'',nx&&nx.t!=='¡Trabajo!'?VS.ex(nx.t.replace(/ · (derecha|izquierda)$/,'')):''],{full:true});}
    const nx=q.steps[i+1];speakSegs([vpick('sp',VZ.seqPrep),nx&&nx.t!=='¡Trabajo!'?VZ.single.seqFirst:'',nx&&nx.t!=='¡Trabajo!'?VS.ex(nx.t.replace(/ · (derecha|izquierda)$/,'')):'']);
  },
  seqHalf(){speakSegs([vpick('sh',VZ.seqHalf)],{full:true});},
  seqFinish(kind){speakSegs([VZ.seqFin[kind]||VZ.seqFin.hiit,vpick('sfe',VZ.seqFinEnd)]);},
  // Ajustes
  mode(m){speakSegs([m==='full'?VZ.single.modeFull:VZ.single.modeBasic]);},
  rate(){speakSegs([VZ.single.rate]);},
  sample(){if(!useClips()){say(VZ.single.hiTel+' Serie 2 de 4. 8 kilos, 10 repeticiones.');return;}
    speakSegs([vname(3)||VZ.single.hi,vname(3)?VZ.single.hi:'',vsex()?gz(VZ.single.hi2):'',VS.serie(2,4),VS.kg(8),VS.reps(10),vpick('go',VZ.go)]);}
};

/* ---------- catálogo para grabar los clips ---------- */
window.__voiceCatalog=function(names){
  const out={},add=(t,style)=>{if(!t)return;if(t.includes('{')){add(t.replace(GZ,'$1'),style);add(t.replace(GZ,'$2'),style);return;}out[vhash(t)]={t,s:style||'info'};};
  const hype=['go','setOk','timedGo','timedHalf','timedEnd','prIntro','fin','seqHalf','seqWork','seqFinEnd'];
  for(const k in VZ){const v=VZ[k];if(Array.isArray(v)&&typeof v[0]==='string')v.forEach(t=>add(t,hype.includes(k)?'hype':k==='rest'||k==='finEnd'||k==='warmIntro'?'calm':'info'));}
  Object.values(VZ.seqFin).forEach(t=>add(t,'hype'));
  Object.entries(VZ.single).forEach(([k,t])=>add(t,k==='modeFull'||k==='hi'?'hype':'info'));
  Object.values(VCUE).forEach(t=>add(t,'calm'));
  (names||[]).forEach(n=>VZ.name.forEach((f,i)=>add(f(n),i===2||i===4?'info':'hype')));
  for(let n=1;n<=10;n++){add(VS.nSeries(n));for(let k=1;k<=n;k++)add(VS.serie(k,n),k===n&&n>1?'hype':'info');}
  for(let x=0.5;x<=80;x+=0.5)add(VS.kg(x));
  const sides=[null,'lado','pierna','brazo'];
  for(let r=1;r<=50;r++)sides.forEach(sd=>add(VS.reps(r,sd)));
  for(let s=5;s<=180;s+=5)sides.forEach(sd=>add(VS.secs(s,sd)));
  for(let s=5;s<=300;s+=5)add(VS.rest(s));
  for(let m=1;m<=180;m++)add(VS.minutes(m));
  for(let s=1;s<=120;s++)add(VS.setsDone(s));
  for(let n=1;n<=30;n++)add(VS.prs(n),'hype');
  for(let n=2;n<=99;n++)add(VS.level(n),'hype');
  RANKS.forEach(r=>add(VS.rank(r[1]),'hype'));
  for(let n=2;n<=10;n++)add(VS.block(n));
  for(let n=2;n<=5;n++)add(n+' minutos.');add('Un minuto.');
  ALLEX.forEach(e=>add(VS.ex(e.n)));
  Object.values(WARMUPS).forEach(l=>l.forEach(w=>{add(VS.ex(w[0]));add(warmDose(w[1]));}));
  add(VS.ex('Caminadora, bici o elíptica suave'));CARDIO.forEach(q=>add(VS.ex('Cardio suave en '+EQ[q].t.toLowerCase())));
  Object.values(ST).forEach(x=>add(VS.ex(x[0])));MOB.forEach(x=>add(VS.ex(x[0])));HIITX.forEach(x=>add(VS.ex(x[0])));ABSX.forEach(x=>add(VS.ex(x[0])));
  return out;
};


/* ===================== v4 · mapa muscular, series por músculo y fotos ===================== */
const MREG={'Pecho':'chest','Pecho alto':'chest','Tríceps':'tri','Hombro':'delt','Hombro lateral':'delt','Hombro anterior':'delt','Hombro posterior':'rdelt',
  'Core':'abs','Abdomen':'abs','Abdomen bajo':'abs','Oblicuos':'obl','Espalda':'lats','Espalda alta':'traps','Trapecio':'traps','Lumbar':'lower',
  'Bíceps':'bi','Braquial':'bi','Antebrazo':'fore','Cuádriceps':'quad','Glúteo':'glute','Isquiotibiales':'ham','Pantorrilla':'calf','Aductores':'add','Abductores':'glute'};
const RNAME={chest:'Pecho',tri:'Tríceps',delt:'Hombros',rdelt:'Hombro posterior',abs:'Abdomen',obl:'Oblicuos',lats:'Dorsales',traps:'Espalda alta',lower:'Lumbar',
  bi:'Bíceps',fore:'Antebrazo',quad:'Cuádriceps',glute:'Glúteos',ham:'Isquiotibiales',calf:'Pantorrillas',add:'Aductores'};
const BIG=new Set(['chest','lats','quad','glute','ham','traps','lower']);
const MAIN=['chest','lats','traps','delt','rdelt','bi','tri','quad','ham','glute','calf','abs'];
function regionsOf(n){const m=info(n).m,o={};m.forEach((x,i)=>{const r=MREG[x];if(r&&!(r in o))o[r]=i===0?1:.5;});return o;}
function recovery(){
  const now=Date.now(),out={};
  for(const h of S.history){if(now-h.ts>8*864e5)break;
    (h.ex||[]).forEach(z=>{const R=regionsOf(z.n),sets=z.s.filter(x=>x[2]!=='c').length;for(const r in R){const o=out[r]||(out[r]={last:0,sets:0});
      if(h.ts>o.last){o.last=h.ts;o.sets=0;}if(h.ts===o.last)o.sets+=sets*R[r];}});}
  const res={};for(const r in RNAME){const o=out[r];if(!o){res[r]=null;continue;}
    const base=BIG.has(r)?72:48,need=base*Math.max(.6,Math.min(1.4,o.sets/6)),hrs=(now-o.last)/36e5;
    res[r]={pct:Math.max(0,Math.min(100,Math.round(hrs/need*100))),hrs,sets:o.sets};}
  return res;
}
const recCls=x=>!x?'rn':x.pct>=100?'r4':x.pct>=67?'r3':x.pct>=34?'r2':'r1';
function weekSets(days){
  const since=Date.now()-(days||7)*864e5,o={};MAIN.forEach(r=>o[r]=0);
  S.history.forEach(h=>{if(h.ts<since)return;(h.ex||[]).forEach(z=>{const R=regionsOf(z.n),n=z.s.filter(x=>x[2]!=='c').length;for(const r in R)if(r in o)o[r]+=n*R[r];});});
  return o;
}

function recoveryCard(full){
  const rec=recovery(),ready=[],tired=[];
  MAIN.forEach(r=>{const x=rec[r];if(x&&x.pct<67)tired.push(RNAME[r]);else ready.push(RNAME[r]);});
  const anyData=Object.values(rec).some(Boolean);
  let h=`<div class="card recov ${full?'':'mini'}" ${full?'':'data-act="tab" data-v="prog"'}><div class="bodies">${bodySVG('f',rec,!full)}${bodySVG('b',rec,!full)}</div><div class="rtxt">`;
  if(!anyData)h+=`<b>Todo listo</b><span>Cuando entrenes, aquí ves qué músculos están cansados y cuáles listos.</span>`;
  else h+=`<b>${tired.length?'Recuperando: '+tired.slice(0,4).join(', '):'Todos tus músculos están listos'}</b><span>${tired.length?'Listos: '+ready.slice(0,5).join(', '):'Buen momento para entrenar duro.'}</span>`;

  return h;
}

let IDB=null;
function idb(){if(IDB)return IDB;IDB=new Promise((res,rej)=>{try{const r=indexedDB.open('mancuernas',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return IDB;}
async function phAll(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res((q.result||[]).sort((a,b)=>a.ts-b.ts));q.onerror=()=>res([]);});}catch(e){return [];}}
async function phPut(o){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function phDel(id){const db=await idb();return new Promise(res=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=res;});}
let PH=[],PHURL={};
const phUrl=p=>PHURL[p.id]||(PHURL[p.id]=URL.createObjectURL(p.blob));
async function phLoad(){PH=await phAll();const el=$('#phgrid');if(el)el.innerHTML=phGrid();}
function phGrid(){
  if(!PH.length)return `<div class="phempty">${IC.cam}<span>Una foto cada 2 a 4 semanas, misma luz y misma pose. Es la mejor forma de ver el cambio.</span></div>`;
  const l=PH.slice(-6).reverse();

}
function photosCard(){

async function phAdd(file){
  try{const img=await createImageBitmap(file).catch(()=>null)||await loadImg(URL.createObjectURL(file));if(!img){toast('No se pudo leer la foto');return;}
    const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));const p={id:'ph'+Date.now(),ts:Date.now(),blob};await phPut(p);await phLoad();render();toast(IC.check+'<span>Foto guardada en este teléfono</span>');
  }catch(e){toast('No se pudo guardar la foto');}
}
function phView(id){const p=PH.find(x=>x.id===id);if(!p)return;
  sheet(`<div class="over">${cap1(new Date(p.ts).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</div><img class="phbig" src="${phUrl(p)}" alt=""><div class="acts"><button class="btn" data-act="close">Cerrar</button><button class="btn ghost danger" data-act="phdel" data-v="${id}">Borrar foto</button></div>`);}
let CMP=null;
function phCompare(){
  if(PH.length<2)return;CMP=CMP||{a:PH[0].id,b:PH[PH.length-1].id};
  const A=PH.find(x=>x.id===CMP.a)||PH[0],B=PH.find(x=>x.id===CMP.b)||PH[PH.length-1];
  const dd=Math.round((B.ts-A.ts)/864e5);
  const opt=sel=>PH.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${new Date(p.ts).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'2-digit'})}</option>`).join('');
  sheet(`<h3>Antes y después</h3><p class="sub">${dd} días de diferencia. Desliza para comparar.</p>
  <div class="cmp"><img src="${phUrl(A)}" alt="Antes"><div class="cmpb" id="cmpb" style="clip-path:inset(0 0 0 50%)"><img src="${phUrl(B)}" alt="Después"></div><i id="cmpl" style="left:50%"></i><span class="t1">Antes</span><span class="t2">Después</span></div>
  <input type="range" id="in-cmp" min="0" max="100" value="50" aria-label="Comparar" style="width:100%;margin-top:10px">
  <div class="cmpsel"><label>Antes<select id="cmpa">${opt(A.id)}</select></label><label>Después<select id="cmpbsel">${opt(B.id)}</select></label></div>
  <div class="acts"><button class="btn" data-act="close">Cerrar</button></div>`);
}
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='in-cmp'){const v=t.value;const b=$('#cmpb'),l=$('#cmpl');if(b)b.style.clipPath=`inset(0 0 0 ${v}%)`;if(l)l.style.left=v+'%';}});
document.addEventListener('change',ev=>{const t=ev.target;
  if((t.id==='in-photo'||t.id==='in-photo2')&&t.files&&t.files[0]){phAdd(t.files[0]);t.value='';}
  else if(t.id==='cmpa'){CMP.a=t.value;phCompare();}else if(t.id==='cmpbsel'){CMP.b=t.value;phCompare();}});
function bodyAct(a,v){
  switch(a){
    case 'phview':phView(v);return true;
    case 'phdel':{const old=PH.find(x=>x.id===v);phDel(v).then(phLoad).then(()=>{closeSheet();render();if(old)undoable('Foto borrada',()=>{phPut(old).then(phLoad).then(render);});});return true;}
    case 'phcmp':CMP=null;phCompare();return true;
  }
  return false;
}

function buildSeq(key,cfg){
  const steps=[];const add=(t,d,k,sub,img)=>steps.push({t,d,k,sub:sub||'',img:img||null});
  if(key==='hiit'){const c=cfg;let x=0;const H=i=>HIITX[i%HIITX.length];
    add('Prepárate',10,'prep','Primero: '+(c.names?H(0)[0]:'trabajo'),c.names?H(0)[1]:null);
    for(let s=0;s<c.sets;s++){for(let r=0;r<c.rounds;r++){const h=H(x++);add(c.names?h[0]:'¡Trabajo!',c.work,'work',`Ronda ${r+1} de ${c.rounds}${c.sets>1?` · bloque ${s+1} de ${c.sets}`:''}${c.names?' · '+h[2]:''}`,c.names?h[1]:null);
      if(r<c.rounds-1&&c.rest>0)add('Descansa',c.rest,'rest',`Siguiente: ${c.names?H(x)[0]:'trabajo'}`,c.names?H(x)[1]:null);}
      if(s<c.sets-1)add('Descanso largo',c.setRest,'rest',`Bloque ${s+2} a continuación`,c.names?H(x)[1]:null);}
    return {t:cfg.name||'Intervalos',steps,kind:'hiit'};}
  const S0=SEQS[key];
  if(S0.abs){add('Prepárate',5,'prep','Primero: '+ABSX[0][0],ABSX[0][1]);
    for(let r=0;r<2;r++)ABSX.forEach((x,i)=>{add(x[0],40,'work',`Vuelta ${r+1} de 2 · ${x[2]}`,x[1]);if(!(r===1&&i===ABSX.length-1)){const n=ABSX[(i+1)%ABSX.length];add('Descansa',20,'rest','Siguiente: '+n[0],n[1]);}});
    return {t:S0.t,steps,kind:'abs'};}
  const list=S0.mob?MOB:S0.l.map(k=>ST[k]);
  add('Prepárate',5,'prep','Primero: '+list[0][0],list[0][4]);
  list.forEach((x,i)=>{if(x[3]){add(x[0]+' · derecha',x[1],'work',x[2],x[4]);add(x[0]+' · izquierda',x[1],'work',x[2],x[4]);}else add(x[0],x[1],'work',x[2],x[4]);
    const n=list[i+1];if(n)add('Cambia',5,'rest','Siguiente: '+n[0],n[4]);});
  return {t:S0.t,steps,kind:S0.mob?'mob':'stretch'};
}

function seqStart(key,cfg){

function seqTotal(){return SQ.steps.reduce((a,s)=>a+s.d,0);}
function seqRender(){
  const st=SQ.steps[SQ.i],nx=SQ.steps[SQ.i+1],rem=SQ.paused||Math.max(0,(SQ.until-Date.now())/1000);
  const done=SQ.steps.slice(0,SQ.i).reduce((a,s)=>a+s.d,0)+(st.d-rem),pc=done/seqTotal()*100;
  const lbl=st.k==='work'?(SQ.kind==='hiit'||SQ.kind==='abs'?'Trabajo':'Sostén'):st.k==='rest'?'Descanso':'Preparación';
  $('#seq').className='k-'+st.k+(st.img?'':' noimg');
  $('#seq').innerHTML=`<div class="sqbar"><button class="iconbtn" data-act="seqquit" aria-label="Salir">${IC.x}</button><b>${esc(SQ.t)}</b><span>${SQ.i+1}/${SQ.steps.length}</span></div><div class="sqprog"><i style="width:${pc.toFixed(1)}%"></i></div>
  <div class="sqmain">${st.img?`<div class="sqart ${st.k!=='work'?'dim':''}"><img src="${IMG(st.img)}" alt="">${st.k!=='work'?'<span class="sqtag">Siguiente</span>':''}</div>`:''}

const MPOOL=['pr','vol','stretch','hiit','body','sets','feel','full'];
function missionsFor(ws,hist){
  const we=ws+7*864e5,wk=Math.round(ws/(7*864e5)),H=hist.filter(h=>h.ts>=ws&&h.ts<we),A=S.acts.filter(a=>a.ts>=ws&&a.ts<we),td=trainDays();
  const prev=[1,2,3,4].map(k=>hist.filter(h=>h.ts>=ws-k*7*864e5&&h.ts<ws-(k-1)*7*864e5).reduce((a,h)=>a+(h.vol||0),0)).filter(v=>v>0);
  const volT=Math.max(500,Math.round((prev.length?prev.reduce((a,b)=>a+b,0)/prev.length*1.05:1500)/100)*100);
  const D={
    train:{t:`Completa ${td} entrenamientos`,goal:td,cur:H.length,xp:150,ic:IC.dumb},
    pr:{t:'Logra un récord personal',goal:1,cur:H.reduce((a,h)=>a+(h.pr||[]).length,0),xp:100,ic:IC.trophy},
    vol:{t:`Mueve ${NF.format(volT)} kg en la semana`,goal:volT,cur:H.reduce((a,h)=>a+(h.vol||0),0),xp:100,ic:IC.layers,fmt:x=>NF.format(Math.round(x))},
    stretch:{t:'Haz 2 sesiones de estiramiento o movilidad',goal:2,cur:A.filter(a=>a.kind==='stretch'||a.kind==='mob').length,xp:80,ic:IC.clock},
    hiit:{t:'Completa intervalos o abdomen exprés',goal:1,cur:A.filter(a=>a.kind==='hiit'||a.kind==='abs').length,xp:80,ic:IC.bolt},
    body:{t:'Registra tu peso',goal:1,cur:S.body.filter(b=>b.ts>=ws&&b.ts<we&&b.w!=null).length,xp:50,ic:IC.body},
    sets:{t:`Completa ${td*14} series`,goal:td*14,cur:H.reduce((a,h)=>a+(h.sets||0),0),xp:100,ic:IC.check},
    feel:{t:'Califica cómo se sintieron 3 entrenos',goal:3,cur:H.filter(h=>h.feel).length,xp:50,ic:IC.star},
    full:{t:'Termina un entreno en versión completa',goal:1,cur:H.filter(h=>h.mode==='full').length,xp:60,ic:IC.flame.replace('<svg','<svg class="i"')}};
  const a=MPOOL[((wk%MPOOL.length)+MPOOL.length)%MPOOL.length],b=MPOOL[(((wk*3+2)%MPOOL.length)+MPOOL.length)%MPOOL.length];
  const keys=['train',a,b===a?MPOOL[(MPOOL.indexOf(a)+1)%MPOOL.length]:b];
  return keys.map(k=>Object.assign({k},D[k],{ok:D[k].cur>=D[k].goal}));
}

const FX_REDUCE=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
function confetti(kind){
  if(FX_REDUCE())return;
  const c=document.createElement('canvas');c.className='fx';const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;document.body.appendChild(c);const g=c.getContext('2d');g.scale(dpr,dpr);
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#3d5afe';
  const cols=kind==='gold'?['#fbbf24','#f59e0b','#fde68a','#ffffff','#fb923c']:[acc,'#fbbf24','#22c55e','#ffffff','#f472b6','#60a5fa'];
  const N=kind==='small'?40:kind==='gold'?90:120,P=[];
  for(let i=0;i<N;i++){const fromL=i%2===0,ang=(fromL?-60:-120)*Math.PI/180+(Math.random()-.5)*.9,sp=7+Math.random()*9;
    P.push({x:kind==='small'?W/2:(fromL?-10:W+10),y:kind==='small'?H*.35:H*.62,vx:Math.cos(ang)*sp*(kind==='small'?.6:1),vy:Math.sin(ang)*sp,w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],t:Math.random()*10});}
  if(kind==='small')P.forEach(p=>{const a=Math.random()*Math.PI*2,sp=3+Math.random()*7;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp-4;});
  const t0=performance.now(),D=kind==='small'?1300:2300;
  const step=t=>{const k=(t-t0)/D;g.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.28;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.t+=.15;
      g.save();g.globalAlpha=Math.max(0,1-Math.max(0,k-.6)/.4);g.translate(p.x,p.y);g.rotate(p.r);g.scale(1,Math.cos(p.t));g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();});
    if(k<1)requestAnimationFrame(step);else c.remove();};
  requestAnimationFrame(step);
}

/* Nutrición: peso saludable para la estatura, gasto calórico, meta según objetivo, macros, agua y menú diario
   con comida colombiana. Es una guía general calculada con fórmulas estándar (Mifflin-St Jeor, IMC de la OMS). */

const ACT={sed:{t:'Poco activo',s:'Estudias o trabajas sentado y caminas poco',f:1.2},lig:{t:'Algo activo',s:'Caminas a diario o pasas parte del día de pie',f:1.3},
  act:{t:'Activo',s:'Trabajo de pie o con esfuerzo físico',f:1.45},muy:{t:'Muy activo',s:'Trabajo pesado o haces otro deporte',f:1.6}};
const GADJ={musculo:[.10,'+10 % para ganar músculo'],fuerza:[.05,'+5 % para ganar fuerza'],grasa:[-.20,'−20 % para bajar grasa'],salud:[0,'mantenimiento']};
const PROT={musculo:1.8,fuerza:1.8,grasa:2.0,salud:1.4};

function bmiCat(b){if(b<18.5)return {t:'Bajo peso',k:'lo'};if(b<25)return {t:'Peso saludable',k:'ok'};if(b<30)return {t:'Sobrepeso',k:'hi'};return {t:'Obesidad',k:'ob'};}
function myBody(){const st=S.settings,w=(typeof lastWeight==='function'&&lastWeight())||st.wt;
  return {sex:st.sex,age:st.age,wt:w,ht:st.ht,act:st.act||'lig'};}
const bodyReady=b=>!!(b.age&&b.wt&&b.ht);
function healthy(ht){const m=(ht/100)**2;return {lo:Math.round(18.5*m*2)/2,hi:Math.round(24.9*m*2)/2,ref:Math.round(22*m*2)/2};}
/* Cálculo completo para una persona */
function nutri(b,goal,days,kadj){
  const bmi=b.wt/((b.ht/100)**2),cat=bmiCat(bmi),hw=healthy(b.ht);
  const s=b.sex==='m'?-161:b.sex==='h'?5:-78;
  const bmr=10*b.wt+6.25*b.ht-5*b.age+s;
  const f=(ACT[b.act]||ACT.lig).f+0.035*Math.min(6,days||0);
  const tdee=bmr*f;
  let g=goal||'salud',note='';
  if(g==='grasa'&&bmi<18.5){g='salud';note='Tu peso está por debajo del rango saludable: en vez de déficit te dejamos en mantenimiento.';}
  if((g==='musculo'||g==='fuerza')&&bmi>=30)note='Con tu IMC conviene ganar músculo sin superávit: comer en mantenimiento y entrenar fuerte.';
  let adj=GADJ[g][0];if((g==='musculo'||g==='fuerza')&&bmi>=30)adj=0;
  const floor=Math.max(b.sex==='m'?1200:b.sex==='h'?1500:1350,bmr);
  let kcal=Math.round(Math.max(floor,tdee*(1+adj))/10)*10;
  if(kadj)kcal=Math.round(Math.max(floor,Math.min(tdee*1.25,Math.max(tdee*.75,kcal+kadj)))/10)*10;
  const base=bmi>27?hw.hi:b.wt; // con sobrepeso la proteína se calcula sobre el peso saludable
  const p=Math.round(PROT[g]*base/5)*5,fat=Math.round(Math.max(0.8*base,kcal*.27/9)/5)*5;
  const c=Math.max(50,Math.round((kcal-p*4-fat*9)/4/5)*5);
  const water=Math.round(b.wt*35/100)/10,waterT=Math.round((b.wt*35+500)/100)/10;
  return {bmi,cat,hw,bmr:Math.round(bmr),tdee:Math.round(tdee/10)*10,kcal,p,f:fat,c,water,waterT,goal:g,adj,note,days:days||0,kadj:kadj||0};
}
/* Entrenos por semana que de verdad hiciste (últimas 4 semanas). Si llevas menos de 2 semanas usando la app, el plan. */
function obsDays(){const now=Date.now(),first=S.history.length?S.history[S.history.length-1].ts:now;
  if(now-first<14*864e5)return null;const n=S.history.filter(h=>now-h.ts<28*864e5).length;return Math.round(n/Math.min(4,(now-first)/(7*864e5))*2)/2;}
function myNutri(){const b=myBody();if(!bodyReady(b))return null;const od=obsDays();
  return Object.assign(nutri(b,(S.program.gen||{}).goal||'musculo',od??trainDays(),S.settings.kadj||0),{obs:od!=null});}

/* ---------- según lo que vemos: tendencia del peso, revisión semanal, meta y grasa corporal ---------- */
// Ritmo sano por semana, como fracción del peso: [mínimo, máximo]
const RATE={grasa:[-.01,-.004],musculo:[.001,.005],fuerza:[0,.004],salud:[-.0025,.0025]};
const RMID={grasa:-.007,musculo:.003,fuerza:.002,salud:0};
function weightTrend(days){
  days=days||28;const now=Date.now(),P=S.body.filter(b=>b.w!=null&&now-b.ts<=days*864e5);
  if(P.length<3)return null;const span=(P[P.length-1].ts-P[0].ts)/864e5;if(span<10)return null;
  const xs=P.map(p=>(p.ts-P[0].ts)/864e5),ys=P.map(p=>p.w),n=P.length,mx=xs.reduce((a,x)=>a+x,0)/n,my=ys.reduce((a,y)=>a+y,0)/n;
  const sl=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/(xs.reduce((a,x)=>a+(x-mx)**2,0)||1);
  return {rate:sl*7,n,span:Math.round(span),now:my+sl*(xs[n-1]-mx)};
}
const kgw=x=>(x>0?'+':x<0?'−':'')+NF.format(Math.abs(Math.round(x*100)/100))+' kg';
/* Revisión semanal: compara el ritmo real con el ideal para el objetivo y propone un ajuste de calorías */
function checkin(N,b){
  const t=weightTrend();if(!t)return {st:'data'};
  const [lo,hi]=RATE[N.goal].map(r=>r*b.wt),mid=RMID[N.goal]*b.wt;
  let st='ok';if(t.rate<lo)st=N.goal==='grasa'?'fast':'slow';else if(t.rate>hi)st=N.goal==='grasa'?'slow':'fast';
  if(N.goal==='salud')st=t.rate<lo||t.rate>hi?'drift':'ok';
  let d=Math.round(Math.max(-250,Math.min(250,(mid-t.rate)*7700/7))/50)*50;if(st==='ok')d=0;
  return {st,t,lo,hi,d};
}
function bodyFat(b){
  const B=S.body,last=k=>{for(let i=B.length-1;i>=0;i--)if(B[i][k]!=null)return B[i][k];return null;};
  const w=last('waist'),n=last('neck'),h=last('hip');if(!b.sex||b.sex==='x')return null;if(!w||!n||!b.ht||(b.sex==='m'&&!h)){const m=[!w&&'cintura',!n&&'cuello',b.sex==='m'&&!h&&'cadera'].filter(Boolean);return {need:m.length>1?m.slice(0,-1).join(', ')+' y '+m[m.length-1]:m[0]};}
  let bf;if(b.sex==='h'){if(w-n<=0)return null;bf=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(b.ht))-450;}
  else{if(w+h-n<=0)return null;bf=495/(1.29579-0.35004*Math.log10(w+h-n)+0.22100*Math.log10(b.ht))-450;}
  bf=Math.round(Math.max(3,Math.min(60,bf))*10)/10;
  const R=b.sex==='h'?[[6,'Atlético'],[14,'En forma'],[18,'Promedio'],[25,'Alto']]:[[14,'Atlético'],[21,'En forma'],[25,'Promedio'],[32,'Alto']];
  let cat=R[0][1];R.forEach(([x,t])=>{if(bf>=x)cat=t;});
  return {bf,cat,lean:Math.round(b.wt*(1-bf/100)*10)/10,ok:b.sex==='h'?bf<20:bf<28};
}
/* Peso meta: sugerido según objetivo y estatura; editable */
function goalWeight(N,b){
  const g=S.settings.goalWt;if(g)return g;
  const r=x=>Math.round(x*2)/2;
  if(N.goal==='grasa')return N.bmi>25?r(Math.max(N.hw.hi,b.wt*.9)):r(Math.max(N.hw.lo,b.wt*.95));
  if(N.goal==='musculo'||N.goal==='fuerza')return N.bmi<25?r(Math.max(b.wt,Math.min(b.wt*1.05,N.hw.hi+5))):r(b.wt);
  return N.bmi>25?r(N.hw.hi):N.bmi<18.5?r(N.hw.lo):r(b.wt);
}

/* ---------- menú ---------- */
const FRAC={0.25:'¼',0.5:'½',0.75:'¾'};
function qtyText(id,q){
  const F=FOODS[id],u=F.u;
  if(u[0]==='g')return `${Math.round(q)} g de ${F.n}`;
  const w=Math.floor(q+1e-6),r=Math.round((q-w)*4)/4,fr=FRAC[r]||'';
  const num=w&&fr?`${w} y ${fr}`:w?String(w):fr;
  const one=q<=1;
  if(['aceite','hogao','cafe','ensalada','verduras'].includes(id)&&q===1)return `${u[0]==='plato'?'1 plato de':u[0]==='taza'?'1 taza de':u[0]==='pocillo'?'1 pocillo de':'1 '+u[0]+' de'} ${F.n}`;
  if(id==='huevo'||id==='banano'||id==='manzana'||id==='arepa'||id==='bocadillo')return `${num} ${one?F.u[0]:F.u[1]}`.replace('½ huevo','medio huevo');
  if(id==='platano')return q>=1?`${num} ${q>1?'plátanos maduros asados':'plátano maduro asado'}`:`${num} de plátano maduro asado`;
  if(id==='aguacate')return `${num} ${one?'cuarto':'cuartos'} de aguacate`.replace('1 cuarto','¼').replace('2 cuartos','½');
  return `${num} ${one?u[0]:u[1]} de ${F.n}`;
}
const grams=(id,q)=>FOODS[id].u[2]*q;
/* Reparto de proteína: más en almuerzo y cena */
const mac=(id,q)=>{const F=FOODS[id],g=grams(id,q)/100;return {k:F.k*g,p:F.p*g,c:F.c*g,f:F.f*g};};
// Con metas altas las porciones pueden crecer (CAPS > 1)
let CAPS=1;
const roundQ=(id,q)=>{const F=FOODS[id],mx=id==='huevo'?Math.min(4,Math.round(F.mx*CAPS)):F.mx*CAPS;return Math.min(mx,Math.max(F.mn,Math.round(q/F.st)*F.st));};
/* Arma una comida para una meta de calorías y proteína */
function buildMeal(tpl,kcal,prot){
  const veg=!!S.settings.veg,items=[];
  let pIds=(veg&&tpl.pv?tpl.pv:tpl.p).filter(id=>!(veg&&['pollo','res','molida','cerdo','pescado','atun'].includes(id)));
  if(!pIds.length)pIds=['huevo'];
  if(tpl.w&&S.settings.whey)pIds=[tpl.w].concat(pIds);
  tpl.x.forEach(([id,q])=>items.push([id,q]));
  const sum=()=>items.reduce((a,[id,q])=>{const m=mac(id,q);a.k+=m.k;a.p+=m.p;a.c+=m.c;a.f+=m.f;return a;},{k:0,p:0,c:0,f:0});
  // proteína: el primer alimento proteico cubre lo que falta
  {const need=Math.max(0,prot-sum().p),id=pIds[0],per=mac(id,1).p||1;items.push([id,roundQ(id,need/per)]);}
  // carbohidratos: reparten lo que falta de calorías
  const cs=tpl.c,left=Math.max(0,kcal-sum().k);
  cs.forEach(id=>{const per=mac(id,1).k||1;items.push([id,roundQ(id,left/cs.length/per)]);});
  // si la proteína se pasó (los carbohidratos también aportan), baja la porción proteica y repone con carbohidratos
  {const pi=items.findIndex(([id])=>id===pIds[0]);for(let g=0;g<4&&pi>=0&&sum().p>prot*1.12;g++){const F=FOODS[pIds[0]],nq=Math.round((items[pi][1]-F.st)*100)/100;if(nq<F.mn)break;items[pi][1]=nq;}
   for(let g=0;g<10&&sum().k<kcal*.955;g++){const ok=items.map(([id,q],j)=>cs.includes(id)&&q+FOODS[id].st<=FOODS[id].mx*CAPS?j:-1).filter(j=>j>=0);if(!ok.length)break;const i=ok[g%ok.length];
     if(sum().k+mac(items[i][0],FOODS[items[i][0]].st).k>kcal*1.06)break;items[i][1]=Math.round((items[i][1]+FOODS[items[i][0]].st)*100)/100;}}
  // si se pasó mucho, baja los carbohidratos un paso
  for(let g=0;g<6&&sum().k>kcal*1.12;g++){const i=items.findIndex(([id,q])=>cs.includes(id)&&q-FOODS[id].st>=FOODS[id].mn);if(i<0)break;items[i][1]=Math.round((items[i][1]-FOODS[items[i][0]].st)*100)/100;}
  const merged=[];items.forEach(([id,q])=>{const m=merged.find(x=>x[0]===id);if(m)m[1]+=q;else merged.push([id,q]);});
  const order=id=>tpl.p.includes(id)||(tpl.pv||[]).includes(id)||id===tpl.w?0:cs.includes(id)?1:2;
  merged.sort((a,b)=>order(a[0])-order(b[0]));
  return {t:veg&&tpl.tv?tpl.tv:tpl.t,items:merged,tot:merged.reduce((a,[id,q])=>{const m=mac(id,q);a.k+=m.k;a.p+=m.p;a.c+=m.c;a.f+=m.f;return a;},{k:0,p:0,c:0,f:0})};
}
/* Calorías del día: un poco más los días de entreno y un poco menos los de descanso (el promedio semanal no cambia) */
function dayKcal(d,N){const t=trainDays(),r=7-t;if(!t||!r)return N.kcal;const b=Math.min(.08,.12*r/t);return Math.round(N.kcal*(S.program.week[d]?1+b:1-b*t/r)/10)*10;}
const TRAINAT={man:['Mañana','des',null],med:['Mediodía','alm','med'],tar:['Tarde','cen','med'],noc:['Noche','cen','med']};
function workoutMeals(d,menu){
  if(!S.program.week[d])return {};const T=TRAINAT[S.settings.trainAt||'tar'],ks=menu.map(m=>m.k||m[0]);
  let post=ks.lastIndexOf(T[1]);if(T[1]==='alm')post=ks.indexOf('alm');
  let pre=-1;if(T[2]){for(let i=post-1;i>=0;i--)if(ks[i]===T[2]||ks[i]==='alm'||ks[i]==='des'){pre=i;break;}}
  return {pre,post};
}
function dayMenu(d,N){
  N=Object.assign({},N,{kcal:dayKcal(d,N)});
  const n=MEALPLAN[S.settings.meals||4],sw=S.settings.mswap||{},used={};CAPS=Math.max(1,N.kcal/2100);
  const WM=workoutMeals(d,n);
  const tpls=n.map(([k],i)=>{let L=MEALS[k];const o=(sw[d+'-'+i]||0)+(used[k]=(used[k]||0)+1)*3;
    if(i===WM.pre){const pl=L.filter(t=>t.pre);if(pl.length)L=pl;} // antes de entrenar: carbohidratos fáciles y poca grasa
    return L[(d*2+i+o)%L.length];});
  // Se arma comida por comida; si el día queda corto o largo, se reparte la diferencia y se arma otra vez
  let f=1,M;
  for(let pass=0;pass<3;pass++){
    M=n.map(([k,label,share],i)=>Object.assign(buildMeal(tpls[i],N.kcal*share*f,N.p*share*(k==='med'?.75:k==='des'?.95:1.12)),{label,slot:i,k}));
    const tot=M.reduce((a,m)=>a+m.tot.k,0),r=N.kcal/tot;if(Math.abs(1-r)<.035)break;f=Math.max(.8,Math.min(1.3,f*r));
  }
  return M;
}
function weekShop(N){
  const tot={};for(let d=0;d<7;d++)dayMenu(d,N).forEach(m=>m.items.forEach(([id,q])=>{tot[id]=(tot[id]||0)+q;}));
  const out={};Object.entries(tot).forEach(([id,q])=>{const F=FOODS[id];(out[F.g]=out[F.g]||[]).push([id,q]);});return out;
}
function shopText(id,q){
  const F=FOODS[id],g=grams(id,q);
  if(F.raw){const r=g/F.raw;return `${F.rn||F.n} (crudo): ${r>=1000?NF.format(Math.round(r/100)/10)+' kg':Math.round(r/50)*50+' g'}`;}
  if(F.u[0]==='g')return `${F.n}: ${g>=1000?NF.format(Math.round(g/100)/10)+' kg':Math.round(g/50)*50+' g'}`;
  const n=Math.ceil(q-1e-6);
  if(id==='aguacate')return `aguacate: ${Math.ceil(q/4)} ${Math.ceil(q/4)===1?'unidad':'unidades'}`;
  if(id==='platano')return `plátano maduro: ${Math.ceil(q)} ${Math.ceil(q)===1?'unidad':'unidades'}`;
  if(['ensalada','verduras'].includes(id))return `${F.n}: ${n} ${n===1?'porción':'porciones'}`;
  if(id==='avena')return `avena en hojuelas: ${Math.round(g/50)*50} g`;
  if(id==='leche')return `leche descremada: ${NF.format(Math.round(g/100)/10)} L`;
  if(id==='yogur')return `yogur griego: ${Math.round(g/50)*50} g`;
  if(id==='cafe'||id==='aceite'||id==='hogao')return F.n;

}

const fk=x=>NF.format(Math.round(x));
function bmiBar(bmi){

  <div class="bmiax"><span>18,5</span><span>25</span><span>30</span></div>`;
}
function healthCard(b,N){

  <p class="nfine">El IMC no distingue músculo de grasa: si entrenas fuerte puedes salir alto estando en forma. La grasa se estima con la fórmula de la Marina de EE. UU. a partir de tus medidas.</p></div>`;
}
function progressCard(N,b){
  const C=checkin(N,b),gw=goalWeight(N,b),diff=Math.round((gw-b.wt)*10)/10,rmid=Math.abs(RMID[N.goal]*b.wt)||Math.abs(.005*b.wt);
  const wks=Math.abs(diff)<.3?0:Math.ceil(Math.abs(diff)/rmid),eta=new Date(Date.now()+wks*7*864e5).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const lastW=(()=>{for(let i=S.body.length-1;i>=0;i--)if(S.body[i].w!=null)return S.body[i];return null;})(),stale=!lastW||Date.now()-lastW.ts>7*864e5;
  const recent=S.settings.kadjAt&&Date.now()-S.settings.kadjAt<6*864e5;
  let msg='',act='';
  if(C.st==='data')msg=`<b>Pésate una vez por semana</b><span>Con 3 registros en dos semanas veo tu ritmo real y ajusto tus calorías si hace falta.</span>`;
  else{const r=`Vas a <b>${kgw(C.t.rate)} por semana</b> (últimas ${C.t.span} días). Lo ideal para tu objetivo es entre ${kgw(C.lo)} y ${kgw(C.hi)}.`;
    if(C.st==='ok')msg=`<b>Vas al ritmo ideal</b><span>${r} Sigue igual.</span>`;
    else{const why={slow:N.goal==='grasa'?'Estás bajando más lento de lo ideal.':'Estás subiendo más lento de lo ideal.',fast:N.goal==='grasa'?'Estás bajando muy rápido: puedes perder músculo.':'Estás subiendo muy rápido: puede ser grasa.',drift:'Tu peso se está moviendo y tu objetivo es mantenerlo.'}[C.st];
      msg=`<b>${why}</b><span>${r}</span>`;
      if(C.d&&!recent)act=`<button class="btn sm pri" data-act="kadj" data-v="${C.d}">${C.d>0?'Subir':'Bajar'} ${Math.abs(C.d)} kcal al día</button>`;
      else if(recent)act=`<small class="nfine">Ya ajustamos hace poco. Dale una semana más antes de cambiar otra vez.</small>`;}}
  return `<div class="card nprog"><div class="nph"><div><span class="over">Peso meta</span><div class="ngw"><button class="iconbtn sm" data-act="gwt" data-v="-0.5" aria-label="Bajar meta">−</button><b>${NF.format(gw)} kg</b><button class="iconbtn sm" data-act="gwt" data-v="0.5" aria-label="Subir meta">+</button></div>
    <small>${wks?`${diff>0?'Te faltan':'Te sobran'} ${NF.format(Math.abs(diff))} kg · unas ${wks} semanas a ritmo seguro (${eta})`:'Ya estás en tu meta: ahora a mantener'}</small></div></div>

  ${stale?`<button class="btn sm ghost block" style="margin-top:10px" data-act="bodyadd">${IC.scale}Registrar mi peso de hoy</button>`:''}
  ${N.kadj?`<div class="nadj">Ajuste por tu progreso: <b>${N.kadj>0?'+':'−'}${Math.abs(N.kadj)} kcal</b><button class="btn sm ghost" data-act="kadj0">Quitar</button></div>`:''}</div>`;
}
/* Peso de las últimas 12 semanas con la línea de la meta */
function wgChart(gw){
  const P=S.body.filter(b=>b.w!=null&&Date.now()-b.ts<=84*864e5);if(P.length<2)return '';
  const W=340,H=110,L=32,R=10,T=10,B=20,iw=W-L-R,ih=H-T-B,vs=P.map(p=>p.w).concat([gw]);
  let lo=Math.min(...vs),hi=Math.max(...vs);const pad=Math.max(.5,(hi-lo)*.15);lo-=pad;hi+=pad;
  const t0=P[0].ts,t1=Math.max(P[P.length-1].ts,t0+864e5),X=t=>L+iw*(t-t0)/(t1-t0),Y=v=>T+ih-ih*(v-lo)/(hi-lo);
  const ln=P.map((p,i)=>(i?'L':'M')+X(p.ts).toFixed(1)+' '+Y(p.w).toFixed(1)).join('');
  const fd=ts=>{const d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1);};
  return `<svg class="wgc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de las últimas semanas y peso meta">
    <line class="gwl" x1="${L}" x2="${W-R}" y1="${Y(gw)}" y2="${Y(gw)}"/><text class="ax gwt" x="${W-R}" y="${Y(gw)-4}" text-anchor="end">Meta ${NF.format(gw)}</text>
    <path class="ln" d="${ln}"/>${P.map((p,i)=>`<circle class="pt" cx="${X(p.ts).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${i===P.length-1?4.5:3}"/>`).join('')}
    <text class="ax" x="${L}" y="${H-5}">${fd(t0)}</text><text class="ax" x="${W-R}" y="${H-5}" text-anchor="end">${fd(P[P.length-1].ts)}</text>
    <text class="ax" x="${L-5}" y="${Y(P[P.length-1].w)+3}" text-anchor="end">${NF.format(P[P.length-1].w)}</text></svg>`;
}

    case 'gwt':{const b=myBody(),N=myNutri();if(!N)return true;st.goalWt=Math.round((goalWeight(N,b)+(+v))*2)/2;saveSettings();render();return true;}

    case 'cnum':{readNum('cc-',CALC,['age','wt','ht']);const [k,d]=v.split('|');CALC[k]=Math.round((CALC[k]+(+d))*10)/10;renderCalc();return true;}
    case 'csex':readNum('cc-',CALC,['age','wt','ht']);CALC.sex=v;renderCalc();return true;
    case 'cact':readNum('cc-',CALC,['age','wt','ht']);CALC.act=v;renderCalc();return true;
    case 'cgoal':readNum('cc-',CALC,['age','wt','ht']);CALC.goal=v;renderCalc();return true;
    case 'mydata':myDataSheet();return true;
    case 'mdnum':{readNum('md-',MYD,['age','wt','ht']);const [k,d]=v.split('|');MYD[k]=Math.round((MYD[k]+(+d))*10)/10;renderMyData();return true;}
    case 'mdsex':readNum('md-',MYD,['age','wt','ht']);MYD.sex=v;renderMyData();return true;
    case 'mdsave':{readNum('md-',MYD,['age','wt','ht']);const D=MYD;if(!(D.age>=12&&D.age<=99&&D.wt>=30&&D.wt<=250&&D.ht>=120&&D.ht<=230)){toast('Revisa los números');return true;}
      st.sex=D.sex||st.sex;st.age=D.age;st.ht=D.ht;st.wt=D.wt;if(lastWeight()!==D.wt)addBody({id:'mcb-'+Date.now(),ts:Date.now(),w:D.wt});saveSettings();closeSheet();render();toast('Datos guardados');return true;}
    case 'myeq':myEqSheet();return true;
    case 'meqplace':if(v==='custom')MYEQ.open=true;else{MYEQ.open=false;MYEQ.eq=PLACES[v].eq.slice();}renderMyEq();return true;
    case 'meq':{const k=MYEQ.eq.indexOf(v);if(k>=0)MYEQ.eq.splice(k,1);else MYEQ.eq.push(v);renderMyEq();return true;}
    case 'meqsave':{st.eq=MYEQ.eq.slice();saveSettings();closeSheet();
      if(v==='re'&&S.program.gen){const g=Object.assign({},S.program.gen,{eq:st.eq.slice()});S.program=genProgram(g);saveProgram();toast(IC.check+'<span>Plan rehecho con tu equipo</span>');}else toast('Equipo guardado');
      render();return true;}
  }
  return false;
}

/* Despachador de acciones de los módulos */
function V4ACT(a,v,b,L){
  for(const f of [planAct,typeof audioAct==='function'?audioAct:null,typeof bodyAct==='function'?bodyAct:null,typeof toolsAct==='function'?toolsAct:null,typeof metaAct==='function'?metaAct:null,typeof foodAct==='function'?foodAct:null])if(f&&f(a,v,b,L))return true;
  return false;
}


/* Eventos e inicio */
/* ---------- eventos ---------- */
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.matches('#player input[data-k]')&&S.live){t.classList.remove('bad');const it=S.live.items[S.live.i];const v=parseFloat(String(t.value).replace(',','.'));const s=it.sets[+t.dataset.r];
    if(s&&!isNaN(v)&&v>=0){s[t.dataset.k]=v;
      if(t.dataset.k==='kg')for(let k=+t.dataset.r+1;k<it.sets.length;k++)if(!it.sets[k].done){it.sets[k].kg=v;const inp=document.querySelector(`#player input[data-k="kg"][data-r="${k}"]`);if(inp)inp.value=v;}
      saveLive();}}
  else if(t.id==='in-name'){S.settings.name=t.value.trim();saveSettings();const a=document.querySelector('.avatar');if(a)a.textContent=(S.settings.name.charAt(0)||'?').toUpperCase();}
  else if(t.id==='libq'){S.lib.q=t.value;const l=$('#liblist');if(l)l.innerHTML=libList();}
  else if(t.id==='obname'){OB.name=t.value;const b=$('#obbtn');if(b)b.textContent=t.value.trim()?'Continuar':'Saltar este paso';}
  else if(/^ob-(age|wt|ht)$/.test(t.id)){obReadBody();const n=$('#obbmi'),okb=OB.age>=12&&OB.age<=99&&OB.wt>=30&&OB.wt<=250&&OB.ht>=120&&OB.ht<=230,b=$('#obbtn');if(b)b.disabled=!okb;if(n){n.className='obnote '+(okb?'':'bad');n.textContent=okb?`IMC ${NF.format(Math.round(OB.wt/((OB.ht/100)**2)*10)/10)} · ${bmiCat(OB.wt/((OB.ht/100)**2)).t}`:'Revisa los datos';}}
  else if(t.id==='pickq'&&PICK){PICK.q=t.value;const l=$('#picklist');if(l)l.innerHTML=pickList();}
});
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.matches('#player input')){setTimeout(()=>{try{t.select();t.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},60);}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='exsel'){S.prog.ex=t.value;render();}
  else if(t.id==='in-vol'){S.settings.vol=+t.value;saveSettings();sfx('set');}
  else if(t.id==='in-rtime'&&t.value){S.settings.remindTime=t.value;saveSettings();scheduleReminders();toast('Recordatorio a las '+t.value);}
  else if(t.id==='in-import'&&t.files&&t.files[0]){const f=t.files[0];if(f.size>5e6){toast('El archivo es demasiado grande');return;}const rd=new FileReader();rd.onload=()=>importData(String(rd.result));rd.readAsText(f);t.value='';}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(ev.key==='Enter'&&ev.target.id==='obname'){obAct('obnext');}
  if(ev.key==='Enter'&&ev.target.matches('#player input')){ev.preventDefault();ev.target.blur();}
});
let lockUntil=0;
/* deslizar a los lados en el entrenamiento para cambiar de ejercicio */
let SW=null;
document.addEventListener('touchstart',ev=>{const t=ev.target;if(!S.live||S.live.phase!=='work'||$('#player').hidden||!$('#sheet').hidden||t.closest('input,button,.sets,#pbottom'))return;const p=ev.touches[0];SW={x:p.clientX,y:p.clientY,t:Date.now()};},{passive:true});
document.addEventListener('touchend',ev=>{if(!SW)return;const p=ev.changedTouches[0],dx=p.clientX-SW.x,dy=p.clientY-SW.y,dt=Date.now()-SW.t;SW=null;
  if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6||dt>600)return;const L=S.live;if(!L||Date.now()<lockUntil)return;lockUntil=Date.now()+380;
  const j=L.i+(dx<0?1:-1);if(j<0||j>=L.items.length)return;L.i=j;saveLive();renderPlayer();const b=$('.exhead');if(b)b.classList.add(dx<0?'swl':'swr');buzz(10);},{passive:true});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b){if(ev.target.id==='sheet')closeSheet();return;}
  if(b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v,L=S.live;
  if(['tick','tgo','tstop','addset','goto','next','prev','jumpsheet'].includes(a)){
    if(Date.now()<lockUntil)return;lockUntil=Date.now()+380;
    if(b.dataset.i!=null&&L&&+b.dataset.i!==L.i)return;
  }
  switch(a){
    case 'tab':{const was=!!S.mePage;S.tab=v;S.prog.bar=null;if(v!=='me'||b.closest('.tabs'))S.mePage=null;render();window.scrollTo(0,0);if(was)syncGuard();break;}
    case 'day':S.sel=+v;render();break;
    case 'mode':S.settings.mode=v;saveSettings();render();scheduleReminders();break;
    case 'info':infoSheet(v);break;
    case 'sess':sessSheet(v);break;
    case 'close':closeSheet();break;
    case 'toastact':{const f=TACT&&TACT.fn;TACT=null;$('#toast').classList.remove('show');if(f)f();break;}
    case 'grp':S.lib.g=v;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===v));$('#liblist').innerHTML=libList();break;
    case 'bar':S.prog.bar=+v;render();break;
    case 'mepage':S.mePage=v||null;render();window.scrollTo(0,0);syncGuard();break;
    case 'errcopy':{const t=JSON.stringify(LS.get(ERRLOG,[]),null,1);try{navigator.clipboard.writeText(t).then(()=>toast('Registro copiado'),()=>toast('No se pudo copiar'));}catch(e){toast('No se pudo copiar');}break;}
    case 'ptab':S.ptab=v;render();window.scrollTo(0,0);break;
    case 'exd':if(v)exDetail(v,'prog');break;
    case 'exdt':{const i=v.indexOf('|');exDetail(v.slice(i+1),v.slice(0,i));const p=$('#sheet .pan');if(p)p.scrollTop=0;break;}
    case 'mo':S.prog.mo=Math.min(0,S.prog.mo+(+v));render();break;
    case 'start':if(S.live){sheet(`<h3>Tienes un entrenamiento en pausa</h3><p class="sub">¿Lo sigues o empiezas el de hoy?</p><div class="acts"><button class="btn pri" data-act="resume">Seguir el anterior</button><button class="btn" data-act="restart">Empezar el de hoy</button><button class="btn ghost" data-act="close">Cancelar</button></div>`);}else startSession();break;
    case 'restart':closeSheet(true);S.live=null;startSession();break;
    case 'resume':{closeSheet(true);const l=S.live;if(l){l.timed=null;if(l.rest&&l.rest.until<Date.now())l.rest=null;if(l.phase==='warm'&&l.warmUntil&&l.warmUntil<Date.now()){l.phase='work';l.warmUntil=0;}openPlayer();}else syncGuard();break;}
    case 'discard':S.live=null;saveLive();render();break;
    case 'rest':S.settings.rest=v==='auto'?'auto':+v;saveSettings();render();break;
    case 'kg':S.settings.kg=Math.max(0.5,Math.round((S.settings.kg+(+v))*2)/2);saveSettings();render();break;
    case 'tog':S.settings[v]=!S.settings[v];saveSettings();if(v==='notif'&&S.settings.notif)askNotif();if(v==='remind'||v==='core'||v==='name')scheduleReminders();if(v==='weekly'||v==='notif')scheduleWeekly();render();if(v==='remind'&&S.settings.remind)toast('Te aviso a las '+S.settings.remindTime+' de lunes a sábado');break;
    case 'theme':S.settings.theme=v;saveSettings();applyTheme();render();break;
    case 'askdel':sheet(`<h3>¿Borrar esta sesión?</h3><p class="sub">Se quita del historial y no se puede recuperar.</p><div class="acts"><button class="btn pri" data-act="del" data-v="${v}">Borrar</button><button class="btn" data-act="close">Cancelar</button></div>`);break;
    case 'del':{const old=S.history.find(h=>h.id===v);delSession(v);closeSheet();render();if(old)undoable('Sesión borrada',()=>{addSession(old);S.history.sort((a,b)=>b.ts-a.ts);LS.set('mc-hist',S.history);render();});break;}
    case 'askwipe':sheet(`<h3>¿Borrar todo el historial?</h3><p class="sub">Se borran tus entrenamientos, récords y logros. No se puede deshacer.</p><div class="acts"><button class="btn pri" data-act="wipe">Borrar todo</button><button class="btn" data-act="close">Cancelar</button></div>`);break;
    case 'wipe':{const old=S.history.slice();old.forEach(h=>delSession(h.id));closeSheet();render();undoable('Historial borrado',()=>{old.slice().reverse().forEach(h=>addSession(h));S.history.sort((a,b)=>b.ts-a.ts);LS.set('mc-hist',S.history);render();});break;}
    case 'askquit':askQuit();break;
    case 'askfinish':{const left=L.items.reduce((a,it)=>a+it.sets.filter(s=>!s.done).length,0);
      if(!left){finish();break;}
      sheet(`<h3>¿Terminar ahora?</h3><p class="sub">Te faltan ${pl(left,'serie','series')}. Se guarda solo lo que marcaste.</p><div class="acts"><button class="btn pri" data-act="finish">Terminar y guardar</button><button class="btn" data-act="close">Seguir entrenando</button></div>`);break;}
    case 'finish':closeSheet(true);finish();syncGuard();break;
    case 'pause':closeSheet(true);if(L)L.timed=null;saveLive();closePlayer();break;
    case 'sumok':S.live=null;S.summary=null;saveLive();S.tab='hoy';closePlayer();break;
    case 'warmgo':ensureAudio();L.wstp=-1;L.warmUntil=Date.now()+WARM*1000;saveLive();renderPlayer();break;
    case 'warmskip':L.phase='work';L.warmUntil=0;L.t0=Date.now();notifCancel();saveLive();renderPlayer();V.first(L.items[L.i]);break;
    case 'radd':if(L.rest){L.rest.until+=(+v)*1000;L.rest.total=Math.max(L.rest.total+(+v),5);if(L.rest.until<Date.now()+1000)L.rest.until=Date.now()+1000;saveLive();tick();}break;
    case 'rskip':L.rest=null;notifCancel();saveLive();renderBottom();break;
    case 'tick':{ensureAudio();const it=L.items[L.i],k=+v,s=it.sets[k];
      if(s.done){s.done=false;L.rest=null;notifCancel();recomputePRs();saveLive();renderPlayer(true);break;}
      const r=readRow(k);if(!r){toast('Revisa el peso y las repeticiones');break;}
      s.kg=r.kg;if(r.reps!=null)s.reps=r.reps;completeRow(k);break;}
    case 'tgo':{ensureAudio();const it=L.items[L.i],r=readRow(+v);const secs=r&&r.reps?r.reps:dose(exOf(it)).timed;L.timed={i:L.i,row:+v,until:Date.now()+secs*1000,secs};L.lastBeepT=null;L.rest=null;saveLive();renderPlayer(true);sfx('work');V.timedGo();break;}
    case 'tstop':{if(!L.timed)break;const held=Math.max(1,Math.round(L.timed.secs-(L.timed.until-Date.now())/1000)),k=L.timed.row;L.timed=null;completeRow(k,held);break;}
    case 'warmsets':addWarmSets();break;
    case 'addset':{const it=L.items[L.i],last=it.sets[it.sets.length-1];it.sets.push({kg:last.kg,reps:last.reps,done:false});saveLive();renderPlayer(true);break;}
    case 'prev':if(L.i>0){L.i--;saveLive();renderPlayer();}break;
    case 'next':if(L.i<L.items.length-1){L.i++;saveLive();renderPlayer();}break;
    case 'jumpsheet':{const it=L.items[L.i];if(it.sets.every(s=>s.done)){const n=nextOpen(L.i+1);if(n>=0){L.i=n;saveLive();renderPlayer();break;}}jumpSheet();break;}
    case 'goto':closeSheet();L.i=+v;saveLive();renderPlayer();break;
    case 'swapsheet':swapSheet();break;
    case 'swap':closeSheet(true);doSwap(v);syncGuard();break;
    case 'feel':{const r=S.summary&&S.summary.rec;if(!r)break;r.feel=r.feel===v?undefined:v;if(!r.feel)delete r.feel;updSession(r);document.querySelectorAll('.feel button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===r.feel));break;}
    case 'sharesum':shareRec(S.summary&&S.summary.rec);break;
    case 'sharesess':shareRec(S.history.find(h=>h.id===v));break;
    case 'export':exportData();break;
    case 'bodyadd':bodySheet();break;
    case 'bodylist':bodyListSheet();break;
    case 'bodydel':{const old=S.body.find(b=>b.id===v);delBody(v);if(S.body.length)bodyListSheet();else closeSheet();render();if(old)undoable('Registro borrado',()=>{addBody(old);render();});break;}
    case 'bodysave':{const b={id:'mcb-'+Date.now(),ts:Date.now()};let n=0,bad=false;
      BODYF.forEach(([k])=>{const i=$('#bf-'+k);const t=i?String(i.value).trim().replace(',','.'):'';if(!t)return;const x=parseFloat(t);
        if(isNaN(x)||x<=0||x>400){i.classList.add('bad');bad=true;return;}b[k]=Math.round(x*10)/10;n++;});
      if(bad){toast('Revisa los números');break;}if(!n){toast('Escribe al menos un dato');break;}
      addBody(b);closeSheet();render();toast('Registro guardado');break;}
    case 'upddis':if(UPD){UPD.dis=UPD.b;LS.set('mc-upd',UPD);}render();break;
    case 'updgo':break;
    default:V4ACT(a,v,b,L);
  }
});

applyTheme();
render();
if(!S.settings.onb&&!S.history.length)showOnb();
initDb();
if(LN&&S.settings.remind)scheduleReminders();
loadPack();setTimeout(ttsInit,1200);
initNative();
setTimeout(checkUpdate,2500);

})();
</script>
