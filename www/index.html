<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><style>@font-face{font-family:"Plus Jakarta Sans";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Plus Jakarta Sans";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Plus Jakarta Sans";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Plus Jakarta Sans";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"Plus Jakarta Sans";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format("woff2")}</style></head><body><title>Mancuernas</title>

<style>
/* Layout: app Android de una columna (máx. 560px). 4 pestañas abajo. El entrenamiento es pantalla completa: cabecera compacta con la figura, tabla de series como protagonista y barra inferior que se convierte en temporizador de descanso. Radios: 16 tarjetas, 12 controles, 10 miniaturas. */
:root{
  --bg:#f4f5f8; --s1:#ffffff; --s2:#eef0f4; --s3:#e3e6ec; --line:#e4e7ec;
  --tx:#0f1115; --tx2:#5a6170; --tx3:#8c93a1;
  --acc:#3d5afe; --acc-tx:#ffffff; --acc-soft:#e9edff;
  --ok:#0f9f6e; --ok-soft:#e2f5ec; --gold:#b86e00; --gold-soft:#fdf1dc; --warn:#c2410c; --warn-soft:#fdece3; --bad:#d92d20;
  --fig:#3b414d; --fig2:#a7aebb; --mus:#3d5afe; --mus2:#9fb0ff; --metal:#111318; --metal2:#7a8190; --prop:#d9dde4; --prop2:#c9ced7; --shadow:#0f1115;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabs:64px; --art-bg:#eef0f4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f13; --s1:#16191f; --s2:#1e2229; --s3:#282d36; --line:#252a32;
  --tx:#f3f4f6; --tx2:#a3a9b5; --tx3:#6f7683;
  --acc:#5b74ff; --acc-tx:#ffffff; --acc-soft:#1c2347;
  --ok:#34d399; --ok-soft:#0f2a1f; --gold:#fbbf24; --gold-soft:#2b2210; --warn:#fb923c; --warn-soft:#2b1a10; --bad:#f97066;
  --fig:#a3abb9; --fig2:#5a616e; --mus:#6f86ff; --mus2:#3a4a9c; --metal:#f3f4f6; --metal2:#8a919e; --prop:#2c313b; --prop2:#232831; --shadow:#000; --art-bg:#1b1f26;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f13; --s1:#16191f; --s2:#1e2229; --s3:#282d36; --line:#252a32;
  --tx:#f3f4f6; --tx2:#a3a9b5; --tx3:#6f7683;
  --acc:#5b74ff; --acc-tx:#ffffff; --acc-soft:#1c2347;
  --ok:#34d399; --ok-soft:#0f2a1f; --gold:#fbbf24; --gold-soft:#2b2210; --warn:#fb923c; --warn-soft:#2b1a10; --bad:#f97066;
  --fig:#a3abb9; --fig2:#5a616e; --mus:#6f86ff; --mus2:#3a4a9c; --metal:#f3f4f6; --metal2:#8a919e; --prop:#2c313b; --prop2:#232831; --shadow:#000; --art-bg:#1b1f26;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.col{max-width:560px;margin:0 auto;padding-inline:16px}
#view{padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(var(--tabs) + 28px + env(safe-area-inset-bottom,0px))}
.fade{animation:fin .22s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
.h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.h2 small{font-size:.8rem;font-weight:600;color:var(--tx2)}
.over{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.sub{color:var(--tx2);font-size:.88rem}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:12px;font-weight:700;font-size:1rem;background:var(--s2);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-tx)}
.btn.light{background:#fff;color:#18203d}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.tbtn{color:var(--acc);font-weight:700;padding:10px 4px;min-height:44px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--s2);flex:none}
.iconbtn:disabled{opacity:.35}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 6px;font-weight:700;font-size:.86rem;border-radius:9px;color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .col{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabs);padding-inline:8px}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--tx3)}
.tabs .pill{display:grid;place-items:center;width:58px;height:30px;border-radius:15px;transition:background .2s}
.tabs button[aria-current="page"]{color:var(--tx)}
.tabs button[aria-current="page"] .pill{background:var(--acc-soft);color:var(--acc)}


/* listas agrupadas */
.glist{list-style:none;margin:0;padding:0;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.glist li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 10px;width:100%;text-align:left}
.row:active{background:var(--s2)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--s2);overflow:hidden;display:block}
.thumb svg{width:100%;height:100%;display:block}
.thumb .mth{fill:var(--s2)}
.row .nm{font-weight:700;line-height:1.25;min-width:0}
.row .ds{font-size:.8rem;color:var(--tx2);margin-top:2px}
.row .chev{color:var(--tx3)}
.ghead{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:20px 4px 8px}


/* inicio */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.streak{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--s1);border:1px solid var(--line);font-weight:800;flex:none}
.streak svg{width:17px;height:17px;color:#ff7a2f}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:16px 0 0}
.week button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0 2px}
.week .l{font-size:.7rem;font-weight:700;color:var(--tx3)}
.week .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.92rem;color:var(--tx2)}
.week .c.on{background:var(--acc);color:#fff}
.week .c.rest{color:var(--tx3)}
.week button.today .c:not(.on){box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc)}
.week button.today .l{color:var(--acc)}
.week .sel{width:5px;height:5px;border-radius:50%;background:transparent}
.week button[aria-pressed="true"] .sel{background:var(--tx)}
.wkcap{font-size:.8rem;color:var(--tx2);text-align:center;margin-top:6px}
.hero{margin-top:14px;border-radius:20px;padding:20px 18px 14px;color:#fff;background:linear-gradient(140deg,#4a63ff 0%,#2d43d9 62%,#2236b8 100%)}
.hero .over{color:rgba(255,255,255,.78);display:flex;align-items:center;gap:8px}
.hero h2{margin:6px 0 2px;font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .mus{color:rgba(255,255,255,.88);font-size:.92rem}
.hero .meta{display:flex;gap:16px;margin:14px 0 16px;flex-wrap:wrap}
.hero .meta span{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem}
.hero .meta svg{width:16px;height:16px}
.hero .done{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:20px;font-size:.72rem;letter-spacing:.02em;color:#fff}
.hero .alt{display:block;width:100%;text-align:center;color:rgba(255,255,255,.9);font-weight:600;font-size:.86rem;padding:12px 0 2px;min-height:44px}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 14px;margin-top:14px;border-color:var(--acc)}
.banner b{display:block;font-size:.95rem}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis div{padding:12px}
.minis b{display:block;font-size:1.25rem;font-weight:800}
.minis span{font-size:.75rem;color:var(--tx2)}
.restday{margin-top:14px;padding:20px 18px}
.restday h2{margin:4px 0 6px;font-size:1.5rem;font-weight:800}


/* biblioteca */
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:14px;height:48px}
.search input{flex:1;min-width:0;border:0;background:transparent;height:100%;outline:none;font-size:1rem}
.search svg{color:var(--tx3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;font-weight:600;font-size:.85rem;background:var(--s1);border:1px solid var(--line);color:var(--tx2)}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--acc-soft);color:var(--acc)}


/* progreso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{padding:12px}
.kpis b{display:block;font-size:1.25rem;font-weight:800}
.kpis span{font-size:.74rem;color:var(--tx2)}
.cal{padding:12px 14px 14px}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .hd b{font-weight:700}
.cal .hd .iconbtn{width:36px;height:36px;border-radius:10px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .dn{font-size:.66rem;font-weight:700;color:var(--tx3);padding:2px 0 4px}
.cal .d{width:32px;height:32px;margin:0 auto;display:grid;place-items:center;border-radius:50%;font-size:.8rem;font-weight:600;color:var(--tx2)}
.cal .d.on{background:var(--acc-soft);color:var(--acc);font-weight:800}
.cal .d.today{background:var(--acc);color:#fff;font-weight:800}
.cal .ft{margin-top:8px;font-size:.8rem;color:var(--tx2)}
.chart{padding:14px 12px 8px}
.chart .cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px}
.chart .cap span{font-size:.8rem;color:var(--tx2)}
.chart .cap b{font-size:1.1rem;font-weight:800}
.chart .cap em{font-style:normal;font-size:.78rem;font-weight:700;margin-left:6px}
.up{color:var(--ok)}.down{color:var(--bad)}
.chart svg{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.chart svg.i{width:18px;height:18px;margin-top:0;display:inline-block;overflow:hidden}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--tx3);font-size:10px;font-family:var(--font);font-weight:600}
.chart .bar{fill:var(--acc);opacity:.35}
.chart .bar.on{opacity:1}
.chart .ln{stroke:var(--acc);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--acc);opacity:.12}
.chart .pt{fill:var(--acc);stroke:var(--s1);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .empty{fill:var(--tx3);font-size:12px;font-family:var(--font)}
.selwrap{position:relative;margin:0 4px 6px}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;height:44px;padding:0 36px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-weight:600}
.selwrap svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--tx2)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{padding:12px 4px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--tx3)}
.badge.on .ic{background:var(--gold-soft);color:var(--gold)}
.badge b{font-size:.7rem;line-height:1.2}
.badge span{font-size:.66rem;color:var(--tx3);font-weight:600}
.kvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.kvrow .v{font-weight:800;white-space:nowrap}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.hrow .t{font-weight:700}
.hrow .d{font-size:.8rem;color:var(--tx2)}
.hrow .r{grid-row:1/3;grid-column:2;text-align:right;font-size:.82rem;color:var(--tx2)}
.hrow .r b{color:var(--tx);display:block;font-size:.9rem}
.wkhead{display:flex;justify-content:space-between;font-size:.74rem;font-weight:700;color:var(--tx3);margin:16px 4px 8px;letter-spacing:.02em}
.tag{display:inline-block;font-size:.64rem;font-weight:800;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:2px;letter-spacing:.03em}
.tag.pr{color:var(--gold);background:var(--gold-soft)}
.tag.ex{color:var(--acc);background:var(--acc-soft)}
.empty{padding:22px 16px;text-align:center;color:var(--tx2)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}


/* perfil */
.me{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none}
.namefield{display:flex;align-items:center;gap:6px}
.namefield input{flex:1;min-width:0;border:0;background:transparent;font-weight:800;font-size:1.15rem;padding:2px 0;outline:none;border-bottom:1.5px dashed var(--line)}
.namefield svg{color:var(--tx3);width:16px;height:16px}
.set{padding:14px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.set .lb{font-weight:600;min-width:0}
.set .lb small{display:block;font-weight:500;color:var(--tx2);font-size:.82rem}
.sw{width:50px;height:30px;border-radius:15px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--acc)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--s2);font-weight:800;font-size:1.2rem}
.stepper b{flex:1;text-align:center;font-size:1.15rem}
.foot{font-size:.78rem;color:var(--tx3);text-align:center;margin-top:18px}


/* reproductor */
#player{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 6px;max-width:560px;width:100%;margin:0 auto}
.pbar .t{flex:1;min-width:0;text-align:center;line-height:1.15}
.pbar .t b{display:block;font-size:1.05rem;font-weight:800}
.pbar .t span{font-size:.78rem;color:var(--tx2)}
.pbody{flex:1;overflow-y:auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.pprog{display:flex;gap:4px;margin:4px 0 12px}
.pprog i{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.pprog i.done{background:var(--ok)}
.pprog i.cur{background:var(--acc)}
.exhead{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center}
.exhead .figwrap{width:128px;height:128px;border-radius:16px;background:var(--art-bg);border:1px solid var(--line);overflow:hidden;cursor:zoom-in}
.exhead .figwrap svg{width:100%;height:100%;display:block}
.exhead .figwrap .mth{fill:var(--s1)}
.exhead h2{margin:0 0 4px;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.exhead .meta{font-size:.84rem;color:var(--tx2);margin-bottom:8px}
.exhead .meta b{color:var(--tx)}
.exhead .how{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;font-size:.86rem;min-height:36px;margin-top:4px}
.exhead .how svg{width:17px;height:17px}
.tip{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--ok-soft);font-size:.85rem}
.tip svg{color:var(--ok);width:18px;height:18px;margin-top:1px}
.sets{margin-top:14px;padding:4px 0 2px}
.sets .hdr,.sets .sr{display:grid;grid-template-columns:34px minmax(0,1fr) 72px 72px 46px;gap:6px;align-items:center;padding:0 8px}
.sets.bw .hdr,.sets.bw .sr{grid-template-columns:34px minmax(0,1fr) 92px 46px}
.sets .hdr{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding-top:8px;padding-bottom:6px}
.sets .hdr span:nth-child(n+3){text-align:center}
.sets .sr{min-height:56px;border-radius:12px;margin:2px 4px;padding:0 4px}
.sets .sr.cur{background:var(--s2)}
.sets .sr.done{background:var(--ok-soft)}
.sets .no{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--tx2)}
.sets .sr.cur .no{background:var(--acc);color:#fff}
.sets .sr.done .no{color:var(--ok)}
.sets .no svg{width:16px;height:16px;stroke-width:3}
.sets .pv{font-size:.8rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;text-align:center;font-weight:600;font-size:1.05rem;padding:0;color:var(--tx3)}
.sets .sr.cur input{background:var(--s1);border-color:var(--s3);color:var(--tx);font-weight:800}
.sets .sr.done input{border-color:transparent;color:var(--tx);font-weight:700}
.sets input:focus{border-color:var(--acc)!important;color:var(--tx);outline:none}
.sets input.bad{border-color:var(--bad)!important}
.sets .ck{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--s2);color:var(--tx3);justify-self:end}
.sets .sr.cur .ck{background:var(--acc);color:#fff}
.sets .sr.done .ck{background:var(--ok);color:#fff}
.sets .ck svg{width:20px;height:20px;stroke-width:3}
.sets .tm{font-weight:800;text-align:center;font-size:1.1rem;color:var(--acc)}

.prbox{margin-top:12px;padding:14px;background:var(--gold-soft);border-color:transparent}

/* hoja */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}to{opacity:1}}
#sheet .pan{background:var(--s1);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:4px auto 14px}

.figbox .mth{fill:var(--s2)}
.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:7px 0;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:12px;margin-top:10px;font-size:.88rem}
.callout.warn{background:var(--warn-soft)}

.callout.info{background:var(--acc-soft)}
.callout.info svg{color:var(--acc)}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 2px;font-size:.85rem;color:var(--tx2)}
.kv b{color:var(--tx)}
.jump .row{grid-template-columns:48px 1fr auto}
.jump .thumb{width:48px;height:48px}
.jump .st{font-size:.8rem;font-weight:700;color:var(--tx3)}
.jump .st.ok{color:var(--ok)}
.jump li.cur .nm{color:var(--acc)}


/* onboarding */
#onb{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
#onb .art{height:50vh;min-height:260px;background:var(--acc-soft);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px);position:relative}

#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:80;background:var(--tx);color:var(--bg);font-weight:700;padding:11px 16px;border-radius:22px;display:flex;align-items:center;gap:8px;transition:transform .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:.9rem;visibility:hidden}
#toast.show{transform:translate(-50%,0);visibility:visible}

.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ilustraciones */
.xa{position:relative;width:100%;height:100%;display:block}
.xa img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.xa.two img.b{animation:xf 3.4s cubic-bezier(.45,0,.25,1) infinite}
.xa.two img.a{animation:xfa 3.4s cubic-bezier(.45,0,.25,1) infinite}
@keyframes xf{0%,28%{opacity:0}46%,78%{opacity:1}96%,100%{opacity:0}}
@keyframes xfa{0%,28%{opacity:1}46%,78%{opacity:0}96%,100%{opacity:1}}
.xa.one img{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 80%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015) translateY(-1px)}}
.thumb .xa img{animation:none!important}
.thumb{background:var(--art-bg)}
.ph{display:flex;gap:6px;justify-content:center;margin-top:6px}
.ph span{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:10px;color:var(--tx3);background:var(--s3)}
.ph.two span:first-child{animation:pha 3.4s cubic-bezier(.45,0,.25,1) infinite}
.ph.two span:last-child{animation:phb 3.4s cubic-bezier(.45,0,.25,1) infinite}
@keyframes pha{0%,28%,96%,100%{background:var(--acc);color:#fff}46%,78%{background:var(--s3);color:var(--tx3)}}
@keyframes phb{0%,28%,96%,100%{background:var(--s3);color:var(--tx3)}46%,78%{background:var(--acc);color:#fff}}
@media (prefers-reduced-motion:reduce){.xa.two img.b,.xa.two img.a,.xa.one img,.ph span{animation:none!important}.xa.two img.b{opacity:0}}
.bn{stroke:var(--fig)}.bf{stroke:var(--fig2)}.mn{stroke:var(--mus)}.mf{stroke:var(--mus2)}
.bnf{fill:var(--fig)}.bff{fill:var(--fig2)}.mnf{fill:var(--mus)}.mff{fill:var(--mus2)}
.fig .bnp{fill:var(--fig);stroke:var(--fig);stroke-width:2.2}.fig .mnp{fill:var(--mus);stroke:var(--mus);stroke-width:2.2}
.mt{fill:var(--metal)}.mtf{fill:var(--metal2)}.fig .mtl{stroke:var(--metal)}.fig .mtfl{stroke:var(--metal2)}.mth{fill:var(--s1)}
.fl{fill:var(--shadow);opacity:.12}.pr{fill:var(--prop)}.pr2{fill:var(--prop2)}
@media (prefers-reduced-motion:reduce){.fade,#sheet .pan,.sum .ok{animation:none}}

.pnote{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font-size:.85rem}

.bsvg .rn{fill:var(--s3)}.bsvg .r1{fill:#ef4444}.bsvg .r2{fill:#f59e0b}.bsvg .r3{fill:#facc15}.bsvg .r4{fill:#22c55e}
.rtxt b{display:block;font-size:.9rem}.rtxt span{font-size:.8rem;color:var(--tx2)}
.rleg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:.72rem;color:var(--tx2);font-weight:600}

.rleg .r1{background:#ef4444}.rleg .r2{background:#f59e0b}.rleg .r3{background:#facc15}.rleg .r4{background:#22c55e}
.wsets{padding:12px 14px}
.wsr{display:grid;grid-template-columns:104px 1fr 34px;gap:8px;align-items:center;padding:4px 0;font-size:.8rem;font-weight:600}

.wsr .band{position:absolute;top:0;bottom:0;background:var(--ok-soft)}

.wsr .fill.ok{background:var(--ok)}.wsr .fill.lo{background:var(--acc)}.wsr .fill.hi{background:var(--warn)}
.photos{padding:12px}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phs button{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--s2)}

.phempty{display:flex;gap:10px;align-items:center;font-size:.84rem;color:var(--tx2);padding:4px}
.phempty svg{flex:none;color:var(--acc)}
.phacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.phacts .btn{flex:1;white-space:nowrap}.phacts svg{width:16px;height:16px}
.phbig{width:100%;border-radius:14px;margin-top:10px;max-height:62vh;object-fit:contain;background:var(--s2)}
.cmp{position:relative;margin-top:12px;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--s2)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmpb{position:absolute;inset:0}

.cmp .t1{left:8px}.cmp .t2{right:8px}
.cmpsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;text-align:left}

.xic svg{width:20px;height:20px}
.xcard b{font-size:.92rem}.xcard small{font-size:.75rem;color:var(--tx2)}
#seq{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;color:#fff;background:#1d2a8a;transition:background .4s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#seq.k-work{background:linear-gradient(160deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000))}
#seq.k-rest{background:linear-gradient(160deg,#0f9f6e,#065f46)}
#seq.k-prep{background:linear-gradient(160deg,#d97706,#92400e)}
.sqbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.sqbar b{flex:1;font-size:.95rem}.sqbar span{font-weight:700;opacity:.8;font-size:.85rem}
.sqbar .iconbtn{background:rgba(255,255,255,.15);color:#fff}
.sqprog{height:4px;margin:0 12px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.sqprog i{display:block;height:100%;background:#fff}
.sqmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px}
.sqmain .over{color:rgba(255,255,255,.75)}
.sqmain h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.1}

#seq .ring .bg{stroke:rgba(255,255,255,.2)}#seq .ring .fg{stroke:#fff}
#seq .ring .t b{font-size:3.6rem}
.sqnext{font-size:.88rem;opacity:.85}
.sqctl{display:flex;gap:12px;align-items:center;justify-content:center;padding:16px}
.sqctl .iconbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff}
.sqctl .btn{min-width:150px;background:#fff;color:#18203d}
.hpresets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.hpresets button{text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line)}
.hpresets b{display:block}.hpresets small{color:var(--tx2);font-size:.75rem}
.hpresets button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.bform.three{grid-template-columns:repeat(3,1fr)}
.rmbig{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding:14px;border-radius:14px;background:var(--acc-soft)}
.rmbig span{font-weight:700}.rmbig b{font-size:1.8rem;font-weight:800;color:var(--acc)}
.rmtbl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rmtbl>div{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:10px;background:var(--s2);font-size:.8rem}

.rmtbl .hd{background:transparent;justify-content:center;color:var(--tx2)}
.nut{margin:14px 0 10px;padding:14px;border-radius:14px;background:var(--acc-soft)}
.nut .kc b{font-size:2rem;font-weight:800;color:var(--acc)}.nut .kc span{font-weight:700;margin-left:6px}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mac div{background:var(--s1);border-radius:10px;padding:8px 4px;text-align:center}

.sumbar .btn svg{width:18px;height:18px}

/* ===== v5: detalles, insignias, celebraciones y nuevas pantallas ===== */
/* tipografía de títulos secundarios que no se parten */
.h2 small{white-space:nowrap;flex:none}
.h2{flex-wrap:nowrap}
/* insignias */
.emb{display:block;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.rkimg{position:relative;overflow:visible}
.rkimg img{border-radius:14px}
.rkem{position:absolute;right:-8px;bottom:-8px}
.ladder span{gap:3px}
.ladder .emb{width:30px;height:30px}
.ladder span:not(.on) .emb{filter:grayscale(1);opacity:.45}
.ladder .cur{background:var(--acc-soft);color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.avatar.emb{background:transparent;width:58px;height:58px}
/* celebraciones */
canvas.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:95}
#toast.act{pointer-events:auto;padding:8px 8px 8px 16px}
#toast .tact{background:rgba(255,255,255,.18);color:inherit;font-weight:800;border-radius:16px;padding:7px 12px;margin-left:6px;font-size:.85rem}
#toast:not(.act){pointer-events:none}
#toast span{white-space:normal;line-height:1.3}
.unl{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;background:var(--gold-soft);border-color:transparent;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.unl .ic{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none}
.unl .ic svg{width:20px;height:20px}
.unl b{display:block;font-size:.98rem}
.unl.mis{background:var(--ok-soft)}.unl.mis .ic{background:var(--ok)}
.unl em{margin-left:auto;font-style:normal;font-weight:800;color:var(--ok)}
.lvup .emb{flex:none}
/* inicio */
.restacts .btn{white-space:nowrap;font-size:.86rem;padding:0 10px}
.restday .btn.ghost{white-space:nowrap}
/* calentamiento con ilustración */
.wart{position:relative;margin:12px auto 12px;width:min(78vw,300px);aspect-ratio:1;border-radius:24px;background:var(--art-bg);border:1px solid var(--line);overflow:hidden}
.wart img{width:100%;height:100%;object-fit:contain;display:block;animation:breathe 3.4s ease-in-out infinite}
.wtime{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(6px)}
.wtime b{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.sqbarmini{flex:1;height:6px;border-radius:3px;background:var(--s3);overflow:hidden;display:block}
.sqbarmini i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;transition:transform .25s linear}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
/* entrenamiento */
.sstag{color:var(--acc);font-weight:800}
.setacts{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px}
.setacts .addset svg{width:16px;height:16px}
.exhead.swl{animation:swl .28s ease-out}.exhead.swr{animation:swr .28s ease-out}
@keyframes swl{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
/* plan: rutinas plegables */
.rhd{padding:4px 6px 4px 4px}
.rtog{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;padding:10px 6px 10px 10px;border-radius:12px}
.rti{flex:1;min-width:0}
.rti b{display:flex;align-items:center;gap:2px;font-size:1.02rem}
.rti small{display:block;color:var(--tx2);font-size:.78rem;font-weight:600;margin-top:2px}
.rchev{color:var(--tx3);transition:transform .2s;display:grid}
.rcard.open .rchev{transform:rotate(180deg)}
.rstrip{display:flex;gap:6px;padding:0 14px 12px;overflow:hidden;width:100%}
.rstrip .thumb{width:40px;height:40px;border-radius:9px;flex:none}
.rstrip .more{width:40px;height:40px;border-radius:9px;background:var(--s2);display:grid;place-items:center;font-size:.78rem;font-weight:800;color:var(--tx2);flex:none}
li.ssA,li.ssB{position:relative}
li.ssA::before,li.ssB::before{content:"";position:absolute;left:4px;width:3px;background:var(--acc);border-radius:2px}
li.ssA::before{top:50%;bottom:-1px}li.ssB::before{top:-1px;bottom:50%}
.ssl{color:var(--acc);font-weight:800}
/* sub-pestañas */
.subtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:12px;background:var(--s2);margin:12px 0 4px;position:sticky;top:0;z-index:5}
.subtabs button{padding:9px 4px;border-radius:9px;font-weight:700;font-size:.84rem;color:var(--tx2);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.subtabs button small{font-size:.7rem;color:var(--tx3)}
.subtabs.sm{position:static;margin-top:14px}
/* mapa de constancia */
.heat{padding:12px 14px}
.hmm,.hmg{display:grid;gap:3px}
.hmm{font-size:.62rem;color:var(--tx3);font-weight:700;margin-bottom:4px;height:12px}
.hmm span{white-space:nowrap;overflow:visible}
.hmg{grid-template-rows:repeat(7,1fr);grid-auto-flow:column}
.hmg i,.hml i{display:block;aspect-ratio:1;border-radius:3px;background:var(--s2)}
.hmg i.q1,.hml i.q1{background:color-mix(in srgb,var(--acc) 30%,var(--s2))}
.hmg i.q2,.hml i.q2{background:color-mix(in srgb,var(--acc) 55%,var(--s2))}
.hmg i.q3,.hml i.q3{background:color-mix(in srgb,var(--acc) 78%,var(--s2))}
.hmg i.q4,.hml i.q4{background:var(--acc)}
.hmg i.qa{background:color-mix(in srgb,var(--ok) 35%,var(--s2))}
.hmg i.fut{opacity:.35}
.hmf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:.74rem;color:var(--tx2);flex-wrap:wrap}
.hml{display:flex;align-items:center;gap:3px}
.hml i{width:10px}
.chart .bar.cur{opacity:.55}
.chart .bar.cur.on{opacity:.8}
/* logros y rango */
.lvhero{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px}
.lvhero>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lvhero b{font-size:1.1rem}
.lvhero small{font-size:.76rem;color:var(--tx2);font-weight:600}
.badges{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.badge b{min-height:2.4em;display:flex;align-items:center;justify-content:center}
button.kvrow{width:100%;text-align:left}
/* página de ejercicio */
#sheet .pan.tall{min-height:86%}
.exdh{text-align:center}
.exdh .figbox{padding:8px;flex-direction:column;align-items:center}
.exdh .figbox .xa{width:min(100%,250px)}
.exdh h3{margin:12px 0 6px}
.exdh .mchips{justify-content:center}
.mchip.p{background:var(--acc);color:#fff}
.mmap{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:12px;padding:12px;border-radius:16px;background:var(--s2)}
.mmap .bsvg{width:84px}
.mleg{display:flex;flex-direction:column;gap:6px;font-size:.74rem;color:var(--tx2);font-weight:600;margin-left:6px}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bsvg .hp,.mleg .hp{fill:var(--acc);background:var(--acc)}
.bsvg .hs,.mleg .hs{fill:color-mix(in srgb,var(--acc) 40%,var(--s3));background:color-mix(in srgb,var(--acc) 40%,var(--s3))}
.mmap .bsvg .mu{stroke:var(--s2)}
.exstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.exstats div{background:var(--s2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.exstats span{font-size:.74rem;color:var(--tx2);font-weight:600}
.exstats b{font-size:1.08rem;font-weight:800}
/* perfil */
.subhd{display:flex;align-items:center;gap:10px;padding-top:6px}
.subhd .h1{margin:0}
.mestats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mestats div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.mestats b{display:block;font-size:1.15rem;font-weight:800}
.mestats span{font-size:.7rem;color:var(--tx2);font-weight:600}
.mrow{grid-template-columns:40px 1fr auto}
.mico{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.mico svg{width:20px;height:20px}
.guide{padding:4px 16px 14px}
.guide h3{font-size:1rem;margin:14px 0 4px}
.guide p{margin:0;font-size:.9rem;color:var(--tx2);line-height:1.45}
.about{display:flex;align-items:center;gap:14px;padding:16px}
.about b{display:block;font-size:1.1rem}.about span{font-size:.82rem;color:var(--tx2)}
.accs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;justify-items:center}
.accs button{width:36px;height:36px}
/* estiramientos e intervalos con ilustración */
.sqart{position:relative;width:min(70vw,300px,38vh);aspect-ratio:1;border-radius:28px;background:rgba(255,255,255,.95);margin-bottom:14px;box-shadow:0 18px 40px rgba(0,0,0,.25);overflow:hidden}
.sqart img{width:100%;height:100%;object-fit:contain;display:block;animation:breathe 3.4s ease-in-out infinite}
.sqart.dim img{opacity:.55;filter:saturate(.7)}

.sqtime{display:flex;align-items:center;gap:12px;width:min(80vw,320px);margin-top:12px}
.sqtime b{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:2.6em}
#seq .sqbarmini{height:8px;background:rgba(255,255,255,.25)}

.sqmain h1{font-size:1.7rem}
.sqlist li{display:flex;align-items:center;gap:12px;padding:8px 12px}

<script>
const L={T:28,N:7,R:5,U:13,F:12,TH:19,SH:19,FT:5};
const RD=Math.PI/180;
const P=(o,a,l)=>[o[0]+l*Math.cos(a*RD),o[1]+l*Math.sin(a*RD)];
const ANG=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])/RD;
const DIST=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const fx=n=>(+n).toFixed(1);

function limb(S,l1,l2,s){
  if(!s) return null;
  if(Array.isArray(s)){const e=P(S,s[0],l1*(s[2]??1));return [e,P(e,s[1],l2*(s[3]??1))];}
  const T=s.to, dd=DIST(S,T)||0.01, u=[(T[0]-S[0])/dd,(T[1]-S[1])/dd];
  const d=Math.min(dd,l1+l2-0.01);
  const a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a)), b=s.b||1;
  const e=[S[0]+a*u[0]-b*h*u[1], S[1]+a*u[1]+b*h*u[0]];
  return [e,P(e,ANG(e,T),l2)];
}

function skel(q){
  const v=q.v||'side', p=q.p, t=q.t??-90, ha=q.h??t;
  const neck=P(p,t,L.T*(q.ts??1)), head=P(neck,ha,L.N);
  const down=ANG(neck,p), sc=P(neck,down,2);
  let sh=[sc,sc], hp=[p,p];
  if(v!=='side'){sh=[P(sc,down+90,6),P(sc,down-90,6)];hp=[P(p,down+90,4),P(p,down-90,4)];}
  if(q.sh) sh=sh.map(s=>[s[0],s[1]-q.sh]);
  const arms=[0,1].map(i=>limb(sh[i],L.U,L.F,q.A&&q.A[i]));
  const legs=[0,1].map(i=>limb(hp[i],L.TH,L.SH,q.L&&q.L[i]));
  const fd=v==='side'?[0,0]:v==='front'?[165,15]:[null,null];
  const fa=q.fa||fd;
  const feet=legs.map((lg,i)=>lg&&fa[i]!=null?P(lg[1],fa[i],L.FT):null);
  return {v,p,neck,head,ha,sc,sh,hp,arms,legs,feet};
}

const poly=pts=>'M'+pts.map(p=>fx(p[0])+' '+fx(p[1])).join('L');
const layer=(ds,wo,wi,cls)=>{const d=ds.filter(Boolean).join('');if(!d)return '';
  return `<path d="${d}" class="o" stroke-width="${wo}"/><path d="${d}" class="${cls}" stroke-width="${wi}"/>`;};

function dumbbell(w,type,fore){
  if(type==null) return '';
  if(type==='end') return `<circle cx="${fx(w[0])}" cy="${fx(w[1])}" r="3.3" class="dbp"/><circle cx="${fx(w[0])}" cy="${fx(w[1])}" r="1" class="dbh"/>`;
  const a=type==='perp'?fore+90:type;
  const A=P(w,a,4.8),B=P(w,a+180,4.8);
  let s=`<path d="${poly([A,B])}" class="dbb"/>`;
  for(const sg of [1,-1]){
    const c=P(w,a+(sg>0?0:180),3.7);
    const pts=[P(P(c,a,1.2),a+90,3.2),P(P(c,a,1.2),a-90,3.2),P(P(c,a,-1.2),a-90,3.2),P(P(c,a,-1.2),a+90,3.2)];
    s+=`<path d="${poly(pts)}Z" class="dbp"/>`;
  }
  return s;
}

function fig(q){
  const s=skel(q);let o='';
  const dbs=Array.isArray(q.db)?q.db:[q.db,q.db];
  const arm=i=>s.arms[i]?poly([s.sh[i],...s.arms[i]]):'';
  const leg=i=>s.legs[i]?poly([s.hp[i],...s.legs[i],...(s.feet[i]?[s.feet[i]]:[])]):'';
  const dbAt=i=>s.arms[i]?dumbbell(s.arms[i][1],dbs[i],ANG(s.arms[i][0],s.arms[i][1])):'';
  const head=()=>{let h=`<circle cx="${fx(s.head[0])}" cy="${fx(s.head[1])}" r="${L.R}" class="hd"/>`;
    if(s.v==='side'){const d=s.ha+90;h+=`<path d="${poly([P(s.head,d,L.R),P(s.head,d,L.R+1.7)])}" class="o" stroke-width="1.2"/>`;}
    return h;};
  const LW=[4.2,2.3];
  if(s.v==='side'){
    o+=layer([leg(1),arm(1)],...LW,'fi')+dbAt(1);
    o+=layer([poly([s.sc,s.neck])],3.2,1.4,'i');
    o+=layer([poly([s.p,s.sc])],8,6.2,'i');
    o+=head();
    o+=layer([leg(0)],...LW,'i');
    o+=layer([arm(0)],...LW,'i')+dbAt(0);
  }else{
    o+=layer([leg(0),leg(1)],...LW,'i');
    o+=layer([poly([s.sc,s.neck])],3.2,1.4,'i');
    o+=`<path d="${poly([s.sh[0],s.sh[1],s.hp[1],s.hp[0]])}Z" class="tf"/>`;
    o+=head();
    o+=layer([arm(0),arm(1)],...LW,'i')+dbAt(0)+dbAt(1);
  }
  return o;
}

function props(list,v){
  let o='';
  if(v!=='top'){
    o+=`<path d="M0 92.4H100" class="ln"/>`;
    let t='';for(let x=5;x<100;x+=6)t+=`M${x} 92.9l-2.4 3`;
    o+=`<path d="${t}" class="tk"/>`;
  }
  for(const p of list){
    if(p.k==='chair'||p.k==='bench'){
      const th=p.k==='bench'?3.6:2.6;
      if(p.back==='l') o+=`<path d="M${p.x1+1.4} ${p.y}V${p.y-22}" class="ln" stroke-width="1.8"/>`;
      o+=`<path d="M${p.x1+1.6} ${p.y+th}V92.4M${p.x2-1.6} ${p.y+th}V92.4" class="ln" stroke-width="1.4"/>`;
      o+=`<rect x="${p.x1}" y="${p.y}" width="${p.x2-p.x1}" height="${th}" rx=".6" class="pf"/>`;
    }else if(p.k==='box'){
      o+=`<rect x="${p.x1}" y="${p.y}" width="${p.x2-p.x1}" height="${92.4-p.y}" class="hb"/>`;
    }else if(p.k==='mat'){
      o+=`<rect x="20" y="14" width="60" height="80" rx="3" class="mt"/>`;
    }
  }
  return o;
}

function exSVG(ex){
  const pr=ex.pr||[];
  const frame=(q,dx)=>`<g transform="translate(${dx} 0)"><g filter="url(#rough)">${props(pr,q.v)}${fig(q)}</g></g>`;
  const body=ex.f.length===1?frame(ex.f[0],55)
    :frame(ex.f[0],0)+`<path d="M100.5 42H109M106 39L109 42L106 45" class="ar"/>`+frame(ex.f[1],110);
  return `<svg viewBox="0 -10 210 106" role="img" aria-label="${ex.n}">${body}</svg>`;
}

function frameSVG(ex,i){
  const q=ex.f[Math.min(i,ex.f.length-1)];
  return `<svg viewBox="0 -10 100 106" role="img" aria-label="${ex.n}"><g filter="url(#rough)">${props(ex.pr||[],q.v)}${fig(q)}</g></svg>`;
}

/* Figuras sólidas con músculo resaltado y animación por interpolación de poses */
const W2={tor:9.6,ua:4.6,fa:3.9,th:6.2,sh:4.7,neck:3.6,foot:3.3,head:5.3};

function posePts(q){
  const s=skel(q);
  const dbs=Array.isArray(q.db)?q.db:[q.db,q.db];
  const db=[0,1].map(i=>{
    if(!s.arms[i]||dbs[i]==null) return null;
    const t=dbs[i], fore=ANG(s.arms[i][0],s.arms[i][1]);
    return t==='end'?{t:'end',a:0}:{t:'bar',a:t==='perp'?fore+90:t};
  });
  return {v:s.v,p:s.p,neck:s.neck,head:s.head,ha:s.ha,sc:s.sc,sh:s.sh,hp:s.hp,arms:s.arms,legs:s.legs,feet:s.feet,db};
}
function lp(a,b,t,k){
  if(a==null) return b; if(b==null) return a;
  if(typeof a==='number'){
    if(k==='ha'||k==='a'){let d=b-a;while(d>180)d-=360;while(d<-180)d+=360;return a+d*t;}
    return a+(b-a)*t;
  }
  if(typeof a==='string') return a;
  if(Array.isArray(a)) return a.map((x,i)=>lp(x,b[i],t,k));
  const o={};for(const key in a)o[key]=lp(a[key],b[key],t,key);return o;
}
const f1=n=>(+n).toFixed(2);
const sg=(a,b,w,c)=>`<path d="M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}" stroke-width="${w}" class="${c}"/>`;

function dbSVG(w,d,far){
  if(!d) return '';
  const c=far?'mtf':'mt';
  if(d.t==='end') return `<circle cx="${f1(w[0])}" cy="${f1(w[1])}" r="3.7" class="${c}"/><circle cx="${f1(w[0])}" cy="${f1(w[1])}" r="1.2" class="mth"/>`;
  const a=d.a;let s=sg(P(w,a,4.6),P(w,a+180,4.6),1.6,c+'l');
  for(const sgn of [0,180]){
    const c1=P(w,a+sgn,3.4),c2=P(w,a+sgn,5.6);
    s+=sg(P(c1,a+90,3.4),P(c1,a-90,3.4),2.6,c+'l')+sg(P(c2,a+90,2.4),P(c2,a-90,2.4),1.8,c+'l');
  }
  return s;
}

function drawPose(Q,hl){
  const H=new Set(hl||[]);
  const cls=(part,far)=>H.has(part)?(far?'mf':'mn'):(far?'bf':'bn');
  const limbArm=(i,far)=>{const a=Q.arms[i];if(!a)return '';
    return sg(Q.sh[i],a[0],W2.ua,cls('ua',far))+sg(a[0],a[1],W2.fa,cls('fa',far))+`<circle cx="${f1(a[1][0])}" cy="${f1(a[1][1])}" r="2.1" class="${far?'bf':'bn'}f"/>`;};
  const limbLeg=(i,far)=>{const l=Q.legs[i];if(!l)return '';
    let s=sg(Q.hp[i],l[0],W2.th,cls('th',far))+sg(l[0],l[1],W2.sh,cls('sh',far));
    if(Q.feet[i])s+=sg(l[1],Q.feet[i],W2.foot,far?'bf':'bn');return s;};
  const delt=(i,far)=>H.has('shd')&&Q.arms[i]?`<circle cx="${f1(Q.sh[i][0])}" cy="${f1(Q.sh[i][1])}" r="3.3" class="${far?'mf':'mn'}f"/>`:'';
  const mid=[(Q.p[0]+Q.sc[0])/2,(Q.p[1]+Q.sc[1])/2];
  const head=`<circle cx="${f1(Q.head[0])}" cy="${f1(Q.head[1])}" r="${W2.head}" class="bnf"/>`;
  let o='';
  if(Q.v==='side'){
    o+=limbLeg(1,true)+limbArm(1,true)+delt(1,true)+dbSVG(Q.arms[1]?Q.arms[1][1]:null,Q.db[1],true);
    o+=sg(Q.sc,Q.neck,W2.neck,'bn');
    o+=sg(Q.p,Q.sc,W2.tor,'bn');
    if(H.has('core'))o+=sg(Q.p,mid,W2.tor,'mn');
    if(H.has('tor'))o+=sg(mid,Q.sc,W2.tor,'mn');
    o+=head;
    o+=limbLeg(0,false)+limbArm(0,false)+delt(0,false)+dbSVG(Q.arms[0]?Q.arms[0][1]:null,Q.db[0],false);
  }else{
    o+=limbLeg(0,false)+limbLeg(1,false);
    o+=sg(Q.sc,Q.neck,W2.neck,'bn');
    const m0=[(Q.sh[0][0]+Q.hp[0][0])/2,(Q.sh[0][1]+Q.hp[0][1])/2],m1=[(Q.sh[1][0]+Q.hp[1][0])/2,(Q.sh[1][1]+Q.hp[1][1])/2];
    const poly=pts=>'M'+pts.map(p=>f1(p[0])+' '+f1(p[1])).join('L')+'Z';
    o+=`<path d="${poly([Q.sh[0],Q.sh[1],Q.hp[1],Q.hp[0]])}" class="bnp"/>`;
    if(H.has('tor'))o+=`<path d="${poly([Q.sh[0],Q.sh[1],m1,m0])}" class="mnp"/>`;
    if(H.has('core'))o+=`<path d="${poly([m0,m1,Q.hp[1],Q.hp[0]])}" class="mnp"/>`;
    o+=head;
    o+=limbArm(0,false)+limbArm(1,false)+delt(0,false)+delt(1,false);
    o+=dbSVG(Q.arms[0]?Q.arms[0][1]:null,Q.db[0],false)+dbSVG(Q.arms[1]?Q.arms[1][1]:null,Q.db[1],false);
  }
  return o;
}

function props2(list,v){
  let o='';
  if(v!=='top') o+=`<ellipse cx="50" cy="93" rx="44" ry="2" class="fl"/>`;
  for(const p of list){
    if(p.k==='chair'||p.k==='bench'){
      const th=p.k==='bench'?4:3.2;
      if(p.back==='l') o+=`<rect x="${p.x1}" y="${p.y-22}" width="3" height="${22+th}" rx="1.4" class="pr"/>`;
      o+=`<rect x="${p.x1+1}" y="${p.y}" width="2.4" height="${92.6-p.y}" rx="1" class="pr2"/><rect x="${p.x2-3.4}" y="${p.y}" width="2.4" height="${92.6-p.y}" rx="1" class="pr2"/>`;
      o+=`<rect x="${p.x1}" y="${p.y}" width="${p.x2-p.x1}" height="${th}" rx="1.6" class="pr"/>`;
    }else if(p.k==='box'){
      o+=`<rect x="${p.x1}" y="${p.y}" width="${p.x2-p.x1}" height="${92.6-p.y}" rx="2" class="pr"/>`;
    }else if(p.k==='mat'){
    }
  }
  return o;
}
const BOX={};
function exBox(ex){
  if(BOX[ex.n]) return BOX[ex.n];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const add=(x,y,r)=>{x0=Math.min(x0,x-r);y0=Math.min(y0,y-r);x1=Math.max(x1,x+r);y1=Math.max(y1,y+r);};
  const walk=o=>{if(!o)return;if(Array.isArray(o)&&o.length===2&&typeof o[0]==='number'){add(o[0],o[1],4.5);return;}
    if(Array.isArray(o))o.forEach(walk);else if(typeof o==='object')for(const k in o)if(k!=='db')walk(o[k]);};
  ex.f.forEach(q=>{const Q=posePts(q);walk(Q);add(Q.head[0],Q.head[1],6.5);
    [0,1].forEach(i=>{if(Q.arms[i]&&Q.db[i])add(Q.arms[i][1][0],Q.arms[i][1][1],7);});});
  (ex.pr||[]).forEach(p=>{if(p.x1!=null){add(p.x1,p.y-(p.back?22:0),1);add(p.x2,92.6,1);}});
  if(ex.f[0].v!=='top')y1=Math.max(y1,95.5);
  let w=x1-x0+8,h=y1-y0+8,cx=(x0+x1)/2,cy=(y0+y1)/2;
  w=Math.max(w,58);h=Math.max(h,58);
  if(w/h>1.5)h=w/1.5; if(w/h<.85)w=h*.85;
  return BOX[ex.n]=`${f1(cx-w/2)} ${f1(cy-h/2)} ${f1(w)} ${f1(h)}`;
}
function figStatic(ex,i){
  const q=ex.f[Math.min(i,ex.f.length-1)];const hl=(INFO[ex.n]||{}).hl;
  return `<svg class="fig" viewBox="${exBox(ex)}" aria-hidden="true"><g>${props2(ex.pr||[],q.v)}</g><g>${drawPose(posePts(q),hl)}</g></svg>`;
}
function figAnimated(ex){
  const q=ex.f[0];
  return `<svg class="fig" viewBox="${exBox(ex)}" role="img" aria-label="${ex.n}" data-anim="${ex.n}"><g>${props2(ex.pr||[],q.v)}</g><g class="pose">${drawPose(posePts(q),(INFO[ex.n]||{}).hl)}</g></svg>`;
}
/* animador: un solo bucle para todas las figuras animadas visibles */
const ANIM={cache:{},raf:0};
function animStart(){
  if(ANIM.raf) return;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const loop=t=>{
    const els=document.querySelectorAll('svg[data-anim]');
    if(!els.length){ANIM.raf=0;return;}
    els.forEach(el=>{
      const n=el.getAttribute('data-anim');const ex=EXMAP[n];if(!ex||ex.f.length<2)return;
      let c=ANIM.cache[n];if(!c)c=ANIM.cache[n]={a:posePts(ex.f[0]),b:posePts(ex.f[1])};
      const T=3600, ph=(t%T)/T;
      let k;
      if(reduce)k=0;
      else if(ph<.14)k=0; else if(ph<.5)k=(ph-.14)/.36; else if(ph<.64)k=1; else k=1-(ph-.64)/.36;
      k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const g=el.querySelector('.pose');
      const key=Math.round(k*60);
      if(g&&g._k!==key){g._k=key;g.innerHTML=drawPose(lp(c.a,c.b,key/60),(INFO[n]||{}).hl);}
    });
    ANIM.raf=requestAnimationFrame(loop);
  };
  ANIM.raf=requestAnimationFrame(loop);
}

  if(!errShown){errShown=true;setTimeout(()=>{try{toast('<span>Algo falló, pero tus datos están a salvo</span>');}catch(x){}},50);}

let COL=null;
const stripId=h=>{const c=Object.assign({},h);delete c.id;return c;};
async function initDb(){
  try{
    if(CAP||!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    COL=db.collection('data/users/'+id);
    const snap=await COL.get();
    const remote=[],rbody=[],racts=[];let rs=null,rp=null;
    snap.docs.forEach(d=>{if(!d.exists)return;const v=d.data();
      if(d.id==='mc-settings') rs=v; else if(d.id==='mc-program') rp=v; else if(d.id.indexOf('mca-')===0) racts.push(Object.assign({},v,{id:d.id})); else if(d.id.indexOf('mcb-')===0) rbody.push(Object.assign({},v,{id:d.id})); else if(d.id.indexOf('mc-')===0) remote.push(Object.assign({},v,{id:d.id}));});
    const bids=new Set(rbody.map(x=>x.id)),bLocal=S.body.filter(b=>!bids.has(b.id));
    for(const b of bLocal){try{await COL.doc(b.id).set(stripId(b));}catch(e){}}
    S.body=rbody.concat(bLocal).sort((a,b)=>a.ts-b.ts);LS.set('mc-body',S.body);
    const ids=new Set(remote.map(x=>x.id));
    const localOnly=S.history.filter(h=>!ids.has(h.id));
    for(const h of localOnly){try{await COL.doc(h.id).set(stripId(h));}catch(e){}}
    S.history=remote.concat(localOnly).sort((a,b)=>b.ts-a.ts);
    if(rs) S.settings=Object.assign(S.settings,rs);
    if(rp&&rp.v===4&&(!S.program||(rp.at||0)>(S.program.at||0)||S.program.legacy&&!rp.legacy)){S.program=rp;LS.set('mc-prog',rp);rebuildProgram();}
    else if(!S.program.legacy||LS.get('mc-prog',null)){try{await COL.doc('mc-program').set(JSON.parse(JSON.stringify(S.program)));}catch(e){}}
    if(typeof mergeActs==='function')await mergeActs(racts);
    S.store='db';LS.set('mc-hist',S.history);LS.set('mc-set',S.settings);
    applyTheme();if($('#player').hidden&&$('#onb').hidden) render();
  }catch(e){COL=null;}
}

/* Cálculos de entrenamiento: plan del día, estimación, récords, racha */
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime();}
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function doneThisWeek(dayId){const ws=weekStart(Date.now());return S.history.some(h=>h.ts>=ws&&h.day===dayId);}
function plan(dayIdx,mode){
  const d=typeof dayIdx==='string'?dayById(dayIdx):dayAt(dayIdx);if(!d)return [];
  const list=mode==='express'?(EXPRESS[d.id]&&S.program.legacy?EXPRESS[d.id].map(i=>d.ex[i]).filter(Boolean):d.ex.slice(0,4)):d.ex;
  const out=list.map(e=>{const ds=dose(e);return {e,sets:mode==='express'?Math.min(3,ds.sets):mode==='suave'?Math.max(2,Math.round(ds.sets*.6)):ds.sets};});
  if(S.settings.core&&mode!=='suave'&&!d.ex.some(e=>PAT[e.n]==='core')){const wk=Math.floor(weekStart(Date.now())/(7*864e5)),o=(wk+S.program.days.findIndex(x=>x.id===d.id))%COREPOOL.length;
    [COREPOOL[o],COREPOOL[(o+1)%COREPOOL.length]].forEach(n=>{const e=EXMAP[n];if(e&&!out.some(x=>x.e===e))out.push({e,sets:2,core:true});});}
  return out;
}
const restOf=e=>S.settings.rest==='auto'?(e.rest||75):+S.settings.rest;
function estimate(p){let t=S.settings.warm?WARM:0;p.forEach(x=>{const ds=dose(x.e);t+=x.sets*((ds.timed||WORK)*(ds.side?2:1)+restOf(x.e));});return Math.max(5,Math.round(t/300)*5);}
function lastFor(name){for(const h of S.history){const x=(h.ex||[]).find(z=>z.n===name);const r=x?x.s.filter(s=>s[2]!=='c'):[];if(r.length)return r;}return null;}
const weighted=n=>{const e=EXMAP[n];return !!e&&!isBW(e)&&!dose(e).timed;};
const e1rm=s=>s[0]*(1+s[1]/30);
function better(n,a,b){
  if(a&&a[2]==='c')return false;
  if(!b)return true;
  if(!weighted(n))return a[1]>b[1];
  if(a[1]<Math.max(5,dose(EXMAP[n]).target-2))return false;
  const ea=e1rm(a),eb=e1rm(b);return ea>eb+0.01||(Math.abs(ea-eb)<=0.01&&a[1]>b[1]);
}
function bestOf(name,hist){let b=null;for(const h of hist){const x=(h.ex||[]).find(z=>z.n===name);if(x)for(const s of x.s)if(better(name,s,b))b=s;}return b;}
const fmtSet=(n,s)=>{const e=EXMAP[n];if(!e||!s)return '';return dose(e).timed?s[1]+' s':isBW(e)?s[1]+' reps':NF.format(s[0])+' kg × '+s[1];};
const fmtShort=(n,s)=>{const e=EXMAP[n];if(!e||!s)return '';return dose(e).timed?s[1]+' s':isBW(e)?s[1]+' reps':NF.format(s[0])+'×'+s[1];};
const fmtSets=z=>z.s.map(s=>fmtSet(z.n,s)).join(' · ');
function streak(){
  const days=new Set(S.history.map(h=>dayKey(h.ts)));
  const d=new Date();d.setHours(12,0,0,0);
  if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);
  let n=0;
  for(let k=0;k<400;k++){if(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1);continue;}if(!dayAt((d.getDay()+6)%7)){d.setDate(d.getDate()-1);continue;}break;}
  return n;
}
function weekStats(){const ws=weekStart(Date.now());const w=S.history.filter(h=>h.ts>=ws);
  return {days:new Set(w.map(h=>h.day)).size,min:Math.round(w.reduce((a,h)=>a+h.dur,0)/60),vol:w.reduce((a,h)=>a+(h.vol||0),0)};}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- nivel y rango ---------- */
const RANKS=[[1,'Novato'],[3,'Aprendiz'],[6,'Guerrero'],[10,'Veterano'],[15,'Maestro'],[20,'Leyenda']];
const xpOf=h=>40+(h.sets||0)*5+((h.pr||[]).length)*25+(h.dur>=1500?20:0);
function level(xp){
  let lv=1,base=0,need=150;while(xp>=base+need){base+=need;lv++;need=150+50*(lv-1);}
  let r=RANKS[0];RANKS.forEach(x=>{if(lv>=x[0])r=x;});const nx=RANKS.find(x=>x[0]>lv);
  return {lv,xp,cur:xp-base,need,rank:r[1],ri:RANKS.indexOf(r),next:nx?nx[1]:null,nextLv:nx?nx[0]:null};
}

const RIDS=[101,102,103,104,105,106,107];
async function scheduleReminders(){
  if(!LN)return;
  try{await LN.cancel({notifications:RIDS.map(id=>({id}))});}catch(e){}
  if(!S.settings.remind)return;
  try{const p=await LN.checkPermissions();if(p.display!=='granted'){const q=await LN.requestPermissions();if(q.display!=='granted'){toast('Activa las notificaciones de la app para recibir el recordatorio');return;}}}catch(e){}
  const [hh,mm]=String(S.settings.remindTime||'18:00').split(':').map(Number);
  const nm=S.settings.name?S.settings.name+', ':'';
  const list=[];for(let i=0;i<7;i++){const d=dayAt(i);if(!d)continue;const p=plan(d.id,S.settings.mode);
    list.push({id:RIDS[i],title:`${nm}hoy toca ${d.t.toLowerCase()}`,body:`${estimate(p)} min · ${pl(p.length,'ejercicio','ejercicios')}. Abre la app y empieza.`,schedule:{on:{weekday:i===6?1:i+2,hour:hh,minute:mm},allowWhileIdle:true}});}

function simpleLine(pts,unit,label){
  const W=340,H=120,L=34,R=12,T=12,B=22,iw=W-L-R,ih=H-T-B;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(lo===hi){lo-=1;hi+=1;}else{const pad=(hi-lo)*.3;lo-=pad;hi+=pad;}
  const X=i=>pts.length===1?L+iw/2:L+iw*i/(pts.length-1),Y=v=>T+ih-ih*(v-lo)/(hi-lo);
  let g='';for(let k=0;k<=2;k++){const v=lo+(hi-lo)*k/2,y=Y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${NF.format(Math.round(v*10)/10)}</text>`;}
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
  if(pts.length>1)g+=`<path class="area" d="${line}L${X(pts.length-1)} ${T+ih}L${X(0)} ${T+ih}Z"/><path class="ln" d="${line}"/>`;
  pts.forEach((p,i)=>{g+=`<circle class="pt" cx="${X(i)}" cy="${Y(p.v)}" r="${i===pts.length-1?5.5:3.5}"/>`;});
  const fd=ts=>{const d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1);};
  g+=`<text class="ax" x="${X(0)}" y="${H-6}" text-anchor="${pts.length>1?'start':'middle'}">${fd(pts[0].ts)}</text>`;
  if(pts.length>1)g+=`<text class="ax" x="${X(pts.length-1)}" y="${H-6}" text-anchor="end">${fd(pts[pts.length-1].ts)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${g}</svg>`;
}

  if(fx){const ci=toks.findIndex(t=>/^C\d/.test(t));const have=new Set(toks.flatMap(t=>t.split('|')));const add=fx.split(' ').filter(t=>!have.has(t));add.forEach(t=>focus.add(t));
    toks.splice(ci<0?toks.length:ci,0,...add);}
  toks.forEach(tok=>{let n=null,used=null;for(const s of tok.split('|')){n=pickSlot(s);if(n){used=s;break;}}
    if(n){ex.add(n);list.push(Object.assign(doseFor(n,gen),focus.has(used)?{fx:1}:{}));}});
  const dur=gen.dur||60;
  const est=l=>estimate(l.map(x=>({e:rex(x),sets:x.sets})));
  const drop=()=>{for(const pass of [0,1])for(let j=list.length-1;j>=0;j--)if(KIND(list[j].n)==='i'&&(pass||!list[j].fx))return j;return -1;};
  const cap=(gen.lvl==='nuevo'?6:gen.lvl==='avanzado'?8:7)+(list.some(x=>KIND(x.n)==='core')?1:0);
  while(list.length>cap){let i=drop();if(i<0)i=list.length-1;list.splice(i,1);}
  while(list.length>4&&est(list)>dur+4){let i=drop();if(i<0)i=list.length-1;list.splice(i,1);}
  for(let g=0;g<20&&est(list)>dur+4;g++){const big=list.filter(x=>x.sets>3).sort((a,b)=>b.sets-a.sets)[0];if(big){big.sets--;continue;}
    const slow=list.filter(x=>x.rest>90).sort((a,b)=>b.rest-a.rest)[0];if(slow){slow.rest-=30;continue;}
    if(list.length>3){list.splice(list.length-1,1);continue;}break;}
  list.forEach(x=>delete x.fx);
  return {id:key,t:T.t,w:T.w,ex:list};
}

  const days=t.d.map(k=>genDay(k,gen));const week=[null,null,null,null,null,null,null];wd.forEach((w,i)=>week[w]=days[i].id);
  return {v:4,gen:Object.assign({},gen,{wd}),name:t.n,days,week,at:Date.now()};
}

function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function weeklyVolume(){

function barChart(data){
  const W=340,H=150,L=34,R=4,T=8,B=22,iw=W-L-R,ih=H-T-B,mx=niceMax(Math.max(...data.map(d=>d.v)));

  data.forEach((d,i)=>{const x=L+i*bw+gap/2,w=bw-gap,hh=d.v?Math.max(3,ih*d.v/mx):0,y=T+ih-hh,r=Math.min(5,w/2,hh);
    const path=hh?`M${x} ${T+ih}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${T+ih}Z`:'';
    g+=`<g data-act="bar" data-v="${i}"><rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${ih+B}"/>${path?`<path class="bar ${i===sel?'on':''} ${i===last?'cur':''}" d="${path}"/>`:(i===last?`<line x1="${x+2}" x2="${x+w-2}" y1="${T+ih-1}" y2="${T+ih-1}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="3 3"/>`:'')}<text class="ax" x="${x+w/2}" y="${H-6}" text-anchor="middle">${i===last?'Esta':d.label}</text></g>`;});

}

function lineChart(name,small){
  const pts=name?exSeries(name):[];
  const W=340,H=small?120:150,L=34,R=12,T=12,B=22,iw=W-L-R,ih=H-T-B;
  if(!pts.length)return `<div class="cap"><span>Sin registros todavía</span></div><svg viewBox="0 0 ${W} ${H}"><line class="gl" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/><text class="empty" x="${W/2}" y="${H/2}" text-anchor="middle">Entrena este ejercicio para ver tu progreso</text></svg>`;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(lo===hi){lo=Math.max(0,lo-2);hi=hi+2;}else{const pad=(hi-lo)*.25;lo=Math.max(0,lo-pad);hi=hi+pad;}
  const X=i=>pts.length===1?L+iw/2:L+iw*i/(pts.length-1),Y=v=>T+ih-ih*(v-lo)/(hi-lo);
  let g='';
  for(let k=0;k<=2;k++){const v=lo+(hi-lo)*k/2,y=Y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${NF.format(Math.round(v))}</text>`;}
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
  if(pts.length>1)g+=`<path class="area" d="${line}L${X(pts.length-1)} ${T+ih}L${X(0)} ${T+ih}Z"/><path class="ln" d="${line}"/>`;
  pts.forEach((p,i)=>{g+=`<circle class="pt" cx="${X(i)}" cy="${Y(p.v)}" r="${i===pts.length-1?5.5:3.5}"/>`;});
  const fd=ts=>{const d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1);};
  g+=`<text class="ax" x="${X(0)}" y="${H-6}" text-anchor="${pts.length>1?'start':'middle'}">${fd(pts[0].ts)}</text>`;
  if(pts.length>1)g+=`<text class="ax" x="${X(pts.length-1)}" y="${H-6}" text-anchor="end">${fd(pts[pts.length-1].ts)}</text>`;
  const first=pts[0],last=pts[pts.length-1];let tr='';
  let since='Mejor serie';if(pts.length>1&&first.v){const pc=Math.round((last.v-first.v)/first.v*100);if(pc){tr=`<em class="${pc>0?'up':'down'}">${pc>0?'+':''}${pc}%</em>`;since=`Mejor serie · cambio desde el ${fd(first.ts)}`;}}
  return `<div class="cap"><span>${since}</span><b>${fmtSet(name,last.b)}${tr}</b></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progreso de ${esc(name)}">${g}</svg>`;
}
function calendar(){

function heatmap(){
  const W=18,D=864e5,end=weekStart(Date.now())+7*D,start=end-W*7*D,sets={},acts={};
  S.history.forEach(h=>{if(h.ts>=start){const k=dayKey(h.ts);sets[k]=(sets[k]||0)+(h.sets||0);}});
  S.acts.forEach(a=>{if(a.ts>=start){const k=dayKey(a.ts);acts[k]=1;}});
  let cells='',months='',lastM=-1,train=0;
  for(let w=0;w<W;w++){const ws=start+w*7*D,m=new Date(ws+3*D).getMonth();
    months+=`<span>${m!==lastM?cap1(new Date(ws+3*D).toLocaleDateString('es-CO',{month:'short'}).replace('.','')):''}</span>`;lastM=m;
    for(let d=0;d<7;d++){const t=ws+d*D+12*3600e3,k=dayKey(t),n=sets[k]||0,fut=t>Date.now();if(n)train++;
      const lv=n>=24?4:n>=16?3:n>=8?2:n>0?1:acts[k]?'a':0;
      cells+=`<i class="q${lv}${fut?' fut':''}" title="${new Date(t).toLocaleDateString('es-CO',{day:'numeric',month:'short'})}${n?': '+n+' series':''}"></i>`;}}
  return `<div class="card heat"><div class="hmm" style="grid-template-columns:repeat(${W},1fr)">${months}</div><div class="hmg" style="grid-template-columns:repeat(${W},1fr)">${cells}</div>
  <div class="hmf"><span>${pl(train,'día entrenado','días entrenados')} en ${W} semanas</span><span class="hml">Menos<i class="q0"></i><i class="q1"></i><i class="q2"></i><i class="q3"></i><i class="q4"></i>Más</span></div></div>`;
}

function rowsFor(e,count){

  const rows=Array.from({length:count},(_,k)=>{const ref=last[Math.min(k,last.length-1)];
    let reps=ds.timed?(ref?ref[1]:ds.timed):(ref?(allTop?ds.target:Math.min(ds.top||99,ref[1]+(ds.fail?0:1))):ds.target);
    return {kg:bw||ds.timed?0:(ref?ref[0]:startKg(e)),reps,done:false};});
  return {rows,up:allTop&&!bw&&!ds.timed};
}

let TK=null;
function startTick(){stopTick();TK=setInterval(tick,250);}
function stopTick(){if(TK)clearInterval(TK);TK=null;}
function tick(){
  const L=S.live;if(!L||L.phase==='summary'||$('#player').hidden)return;
  const el=$('#el');if(el)el.textContent=mmss((Date.now()-L.t0)/1000);
  const now=Date.now();
  if(L.phase==='warm'){
    if(el)el.textContent='0:00';
    if(!L.warmUntil)return;
    const rem=(L.warmUntil-now)/1000,cd=$('#cd'),rg=$('#rg');
    if(cd)cd.textContent=mmss(Math.ceil(rem));if(rg){const C=2*Math.PI*88;rg.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,rem)/WARM)).toFixed(1));}
    const rgf=$('#rgf');if(rgf)rgf.style.transform='scaleX('+Math.min(1,Math.max(0,1-rem/WARM)).toFixed(3)+')';
    const stp=Math.min(4,Math.floor((WARM-rem)/60));document.querySelectorAll('#wl li').forEach((li,i)=>li.classList.toggle('on',i===stp));
    if(stp!==L.wstp&&rem>0){L.wstp=stp;const w=warmSteps(L)[stp];if(w){const wi=$('#wimg');if(wi)wi.src=IMG(warmImg(L,w));if(stp)sfx('half');V.warmStep(w,stp);}}
    if(rem<=0){sfx('go');buzz(400);L.phase='work';L.warmUntil=0;L.t0=Date.now();saveLive();renderPlayer();V.first(L.items[L.i]);}
    return;
  }
  if(L.rest){
    const rem=(L.rest.until-now)/1000,cd=$('#rcd'),pb=$('#rpb');
    if(cd)cd.textContent=mmss(Math.ceil(rem));if(pb)pb.style.transform='scaleX('+Math.max(0,Math.min(1,rem/L.rest.total)).toFixed(3)+')';
    const sec=Math.ceil(rem);if(sec<=3&&sec>0&&L.lastBeep!==sec){L.lastBeep=sec;sfx('tick');}
    if(sec===10&&!L.said10&&L.rest.total>=30){L.said10=true;V.restTen();}
    if(rem<=0){sfx('go');buzz(450);L.rest=null;saveLive();renderBottom();V.restEnd();}
  }
  if(L.timed){
    const rem=(L.timed.until-now)/1000,cd=$('#tcd');
    if(cd)cd.textContent=mmss(Math.ceil(rem));
    const sec=Math.ceil(rem);if(sec<=3&&sec>0&&L.lastBeepT!==sec){L.lastBeepT=sec;sfx('tick');}
    if(!L.timed.half&&rem<=L.timed.secs/2&&L.timed.secs>=20){L.timed.half=true;sfx('half');V.timedHalf();}
    if(rem<=0){const k=L.timed.row,i=L.timed.i,secs=L.timed.secs;L.timed=null;sfx('go');buzz(400);V.timedEnd();if(L.i===i)completeRow(k,secs);else{L.items[i].sets[k].reps=secs;L.items[i].sets[k].done=true;saveLive();renderPlayer(true);}}
  }
}

function endOnb(skip){
  const st=S.settings;
  if(!OB.re){st.name=OB.name.trim()||st.name;if(OB.sex)st.sex=OB.sex;
    if(OB.steps.includes('body')&&!skip){st.age=OB.age;st.ht=OB.ht;st.wt=OB.wt;if(lastWeight()!==OB.wt)addBody({id:'mcb-'+Date.now(),ts:Date.now(),w:OB.wt});}}
  st.kg=OB.kg;st.onb=true;
  if(!skip){st.eq=OB.eq.slice();S.program=OB.prev||genProgram(obGen());saveProgram();st.persDis=true;S.sel=todayIdx;S.pick={};}
  saveSettings();$('#onb').hidden=true;$('#onb').innerHTML='';syncGuard();scheduleReminders();render();
  if(!skip)toast(IC.check+'<span>Plan listo: '+esc(S.program.name.split(' · ')[0])+'</span>');
}
function obMove(d){let i=OB.i+d;while(i>0&&i<OB.steps.length-1&&obSkip(OB.steps[i]))i+=d;return Math.max(0,Math.min(OB.steps.length-1,i));}
function obReadBody(){['age','wt','ht'].forEach(k=>{const i=$('#ob-'+k);if(!i)return;const v=parseFloat(String(i.value).replace(',','.'));if(!isNaN(v))OB[k]=k==='wt'?Math.round(v*10)/10:Math.round(v);});}
function obAct(a,v){
  switch(a){
    case 'obnext':if(OB.steps[OB.i]==='body')obReadBody();if(OB.i<OB.steps.length-1){OB.i=obMove(1);renderOnb();if(OB.steps[OB.i]==='name')setTimeout(()=>{const i=$('#obname');if(i)i.focus();},300);}else endOnb(false);return true;
    case 'obback':if(OB.steps[OB.i]==='body')obReadBody();if(OB.i>0){OB.i=obMove(-1);renderOnb();}return true;
    case 'obskip':endOnb(true);return true;
    case 'obclose':$('#onb').hidden=true;$('#onb').innerHTML='';syncGuard();return true;
    case 'obkg':OB.kg=Math.max(0.5,Math.round((OB.kg+(+v))*2)/2);renderOnb();return true;
    case 'obsex':OB.sex=v;renderOnb();return true;
    case 'obnum':{obReadBody();const [k,d]=v.split('|');OB[k]=Math.round((OB[k]+(+d))*10)/10;renderOnb();return true;}
    case 'obplace':if(v==='custom'){OB.eqOpen=true;}else{OB.eqOpen=false;OB.eq=PLACES[v].eq.slice();}renderOnb();return true;
    case 'obeq':{const k=OB.eq.indexOf(v);if(k>=0)OB.eq.splice(k,1);else OB.eq.push(v);renderOnb();return true;}
    case 'obfocus':OB.focus=v;renderOnb();return true;
    case 'obgoal':OB.goal=v;renderOnb();return true;
    case 'oblvl':OB.lvl=v;renderOnb();return true;
    case 'obdur':OB.dur=+v;renderOnb();return true;
    case 'obwd':{const i=+v,k=OB.wd.indexOf(i);if(k>=0)OB.wd.splice(k,1);else OB.wd.push(i);renderOnb();return true;}
    case 'oblim':if(v==='none')OB.lim=[];else{const k=OB.lim.indexOf(v);if(k>=0)OB.lim.splice(k,1);else OB.lim.push(v);}renderOnb();return true;
  }
  return false;
}
function planAct(a,v){
  const P=S.program,sp=String(v||'').split('|');
  const day=id=>P.days.find(x=>x.id===id);
  switch(a){
    case 'wizard':showOnb(!!S.history.length||!!S.settings.onb);return true;
    case 'persdis':S.settings.persDis=true;saveSettings();render();return true;
    case 'pickday':sheet(`<h3>¿Qué quieres entrenar hoy?</h3><ul class="glist jump" style="margin-top:10px">${P.days.map(d=>`<li><button class="row" data-act="pickdayok" data-v="${d.id}"><span class="dico">${IC.dumb}</span><span class="nm">${esc(d.t)}<small style="display:block;color:var(--tx2);font-weight:500">${pl(d.ex.length,'ejercicio','ejercicios')}</small></span></button></li>`).join('')}</ul><div class="acts"><button class="btn" data-act="close">Cancelar</button></div>`);return true;
    case 'pickdayok':S.pick=S.pick||{};S.pick[S.sel]=v;closeSheet();render();return true;
    case 'startid':if(S.live){toast('Termina o descarta el entrenamiento en pausa primero');return true;}startSession(v);return true;
    case 'wkset':wkSetSheet(+v);return true;
    case 'wkpick':{P.week[+sp[0]]=sp[1]||null;touchProgram();closeSheet();render();return true;}
    case 'exedit':exEditSheet(sp[0],+sp[1]);return true;
    case 'rtog':S.openR=S.openR||{};S.openR[v]=!S.openR[v];render();return true;
    case 'edss':{const x=day(sp[0]).ex[+sp[1]];x.ss=!x.ss;if(!x.ss)delete x.ss;touchProgram();exEditSheet(sp[0],+sp[1]);render();return true;}
    case 'edsets':{const x=day(sp[0]).ex[+sp[1]];x.sets=Math.max(1,Math.min(10,x.sets+(+sp[2])));touchProgram();exEditSheet(sp[0],+sp[1]);render();return true;}
    case 'edreps':{const x=day(sp[0]).ex[+sp[1]],side=(/ por .*/.exec(x.reps)||[''])[0];x.reps=(sp[2]==='al fallo'?sp[2]:sp[2]+side);touchProgram();exEditSheet(sp[0],+sp[1]);render();return true;}
    case 'edcust':{const a1=parseInt($('#ed-a').value,10),b1=parseInt($('#ed-b').value,10);if(!(a1>0&&a1<=100)){toast('Escribe al menos el mínimo');return true;}
      const x=day(sp[0]).ex[+sp[1]],side=(/ por .*/.exec(x.reps)||[''])[0];x.reps=(b1>a1?a1+'–'+b1:String(a1))+side;touchProgram();exEditSheet(sp[0],+sp[1]);render();return true;}
    case 'edrest':{day(sp[0]).ex[+sp[1]].rest=+sp[2];touchProgram();exEditSheet(sp[0],+sp[1]);render();return true;}
    case 'edmove':{const l=day(sp[0]).ex,k=+sp[1],j=k+(+sp[2]);if(j<0||j>=l.length)return true;[l[k],l[j]]=[l[j],l[k]];touchProgram();exEditSheet(sp[0],j);render();return true;}
    case 'edrm':{const l=day(sp[0]).ex,k=+sp[1],old=l.splice(k,1)[0];touchProgram();closeSheet();render();undoable('Quitaste '+esc(old.n),()=>{const d2=day(sp[0]);if(d2){d2.ex.splice(k,0,old);touchProgram();render();}});return true;}
    case 'exadd':pickerSheet('add',v);return true;
    case 'exrepl':pickerSheet('repl',sp[0],+sp[1]);return true;
    case 'pickgrp':PICK.g=v;document.querySelectorAll('#sheet .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===v));$('#picklist').innerHTML=pickList();return true;
    case 'pickex':{const d=day(PICK.id);if(!d)return true;const ne=newEntry(v);
      if(PICK.mode==='repl'){const old=d.ex[PICK.k];d.ex[PICK.k]=Object.assign(ne,{sets:old.sets});touchProgram();exEditSheet(d.id,PICK.k);render();toast('Cambiado por '+esc(v));}
      else{d.ex.push(ne);touchProgram();$('#picklist').innerHTML=pickList();render();toast(IC.check+'<span>Añadido a '+esc(d.t)+'</span>');}
      return true;}
    case 'rmenu':rMenu(v);return true;
    case 'rrename':{const t=($('#rname').value||'').trim();if(!t){toast('Escribe un nombre');return true;}day(v).t=t;touchProgram();closeSheet();render();return true;}
    case 'rdup':{const d=day(v),c=JSON.parse(JSON.stringify(d));c.id='c'+Date.now();c.t=d.t+' (copia)';P.days.push(c);touchProgram();closeSheet();render();return true;}
    case 'rdel':{const snap=JSON.stringify({days:P.days,week:P.week});P.days=P.days.filter(x=>x.id!==v);P.week=P.week.map(x=>x===v?null:x);touchProgram();closeSheet();render();undoable('Rutina borrada',()=>{const o=JSON.parse(snap);S.program.days=o.days;S.program.week=o.week;touchProgram();render();});return true;}
    case 'rnew':{const c={id:'c'+Date.now(),t:'Mi rutina',w:'full',ex:[]};P.days.push(c);S.openR=S.openR||{};S.openR[c.id]=true;touchProgram();render();pickerSheet('add',c.id);return true;}
  }
  return obAct(a,v);
}

/* Sonidos y voz del coach.
   - Sonidos: paquetes de 9 efectos (SoundPool en Android, Web Audio en el navegador). Se mezclan con la música.
   - Voz: clips pregrabados con voz neuronal colombiana (Salomé). Cada frase se arma con segmentos y cada
     segmento es un clip voice/salome/<hash>.mp3. Mientras habla, la música del teléfono baja de volumen.
     Si a una frase le falta algún clip, se dice completa con la voz del teléfono (TextToSpeech). */

const SND=['tick','go','set','half','work','rest','pr','lvl','done'];
const PACKS={
  gym:['Gimnasio','Largada de carrera, pito, pesas y público'],
  anime:['Anime','Aura, impacto y destellos'],
  arcade:['Arcade','8 bits, como consola vieja'],
  clasico:['Clásico','Pitidos limpios de cronómetro'],
  suave:['Suave','Marimba y campanas']
};
const VOICES={off:['Apagado','Solo sonidos'],basic:['Lo esencial','Cada serie, los cambios y los récords'],full:['Coach completo','Además motiva, cuenta el descanso y te acompaña']};
const VVOICES={salome:['Salomé','Colombiana, con sabor paisa'],tel:['Voz del teléfono','La que trae tu Android']};
const WAB={};let loadedPack=null,TTS=null;
const packOf=()=>PACKS[S.settings.pack]?S.settings.pack:'gym';

/* ---------- efectos ---------- */
async function loadPack(){
  const p=packOf();if(loadedPack===p)return;loadedPack=p;
  if(NAT&&typeof NAT.loadSounds==='function'){call(NAT,'loadSounds',{names:SND.map(n=>n+'.wav'),dir:'public/sounds/'+p});return;}
  ensureAudio();if(!AC)return;
  SND.forEach(n=>{const k=p+'/'+n;if(WAB[k])return;fetch('sounds/'+k+'.wav').then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(buf=>{WAB[k]=buf;}).catch(()=>{});});
}
function sfx(n){
  if(!S.settings.sound)return;const p=packOf(),vol=S.settings.vol??.9;
  if(NAT&&typeof NAT.play==='function'){call(NAT,'play',{name:n+'.wav',dir:'public/sounds/'+p,vol});return;}
  try{ensureAudio();const b=WAB[p+'/'+n];if(!AC||!b){beep(n==='tick'?880:1320,.15);return;}const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start();}catch(e){}
}

/* ---------- voz del teléfono (respaldo) ---------- */
async function ttsInit(){
  if(TTS)return;
  if(NAT&&typeof NAT.ttsInit==='function'){try{const r=await NAT.ttsInit({});TTS=r&&r.ok?'nat':'none';}catch(e){TTS='none';}return;}
  TTS=window.speechSynthesis?'web':'none';
}
function voiceOn(o){const m=S.settings.voice||'basic';return !(m==='off'||(o&&o.full&&m!=='full'));}
function say(text,o){
  o=o||{};if(!voiceOn(o)||!text)return;
  if(!TTS){ttsInit().then(()=>say(text,o));return;}if(TTS==='none')return;
  const rate=S.settings.vrate||1;
  if(TTS==='nat'){call(NAT,'speak',{text,rate,queue:!!o.queue});return;}
  try{const u=new SpeechSynthesisUtterance(text);u.lang='es-CO';u.rate=rate;const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));if(vs.length)u.voice=vs.find(v=>/CO/.test(v.lang))||vs.find(v=>/419|MX|US/.test(v.lang))||vs[0];if(!o.queue)speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

/* ---------- voz pregrabada ---------- */
const VDIR='voice/salome';
const VSET=new Set((typeof VCLIPS==='string'?VCLIPS:'').split(' ').filter(Boolean));
function vhash(t){let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16).padStart(8,'0');}
const hasClip=t=>VSET.has(vhash(t));
const useClips=()=>(S.settings.vvoice||'salome')==='salome'&&VSET.size>0;
const VMISS=window.__vmiss=[];
// Velocidad de reproducción de los clips (conserva el tono)
const clipRate=()=>({0.9:.92,1:1,1.2:1.12})[S.settings.vrate||1]||1;
let WQ=[],WA=null,WQT=null;
function webStop(){WQ=[];clearTimeout(WQT);if(WA){try{WA.pause();}catch(e){}WA=null;}}
function webNext(){
  const f=WQ.shift();if(!f){WA=null;return;}
  const a=new Audio(VDIR+'/'+f);WA=a;a.playbackRate=clipRate();a.preservesPitch=true;a.volume=1;
  const go=()=>{if(WA===a){WQT=setTimeout(webNext,70);}};a.onended=go;a.onerror=go;
  a.play().catch(go);
}
function playClips(files,o){
  if(NAT&&typeof NAT.voicePlay==='function'){call(NAT,'voicePlay',{files,dir:'public/'+VDIR,rate:clipRate(),queue:!!o.queue});return;}
  if(!o.queue)webStop();WQ.push(...files);if(!WA)webNext();
}
/* Dice una frase armada por segmentos. o.full: solo en modo "Coach completo". o.queue: no corta lo que suena. */
function speakSegs(segs,o){
  o=o||{};if(!voiceOn(o))return;
  segs=segs.filter(Boolean);if(!segs.length)return;
  if(useClips()){
    const miss=segs.filter(t=>!hasClip(t));
    if(!miss.length){playClips(segs.map(t=>vhash(t)+'.mp3'),o);return;}
    miss.forEach(t=>{if(!VMISS.includes(t))VMISS.push(t);});
  }
  say(segs.join(' '),o);
}

function warmDose(s){const m=/^(\d+)\s*(min|s|reps|por (\w+))$/.exec(s.trim());if(!m)return '';const n=+m[1];
  if(m[2]==='min')return n===1?'Un minuto.':`${n} minutos.`;if(m[2]==='s')return VS.secs(n);if(m[2]==='reps')return VS.reps(n);return VS.reps(n,m[3]);}
function targetSegs(it,k){
  const e=exOf(it),ds=dose(e),s=it.sets[k];if(!s)return [];
  if(ds.timed)return [VS.secs(Math.round((+s.reps||ds.timed)/5)*5||ds.timed,ds.side)];
  if(isBW(e))return [ds.fail?VZ.single.fail:VS.reps(+s.reps||ds.target,ds.side)];
  return [s.kg?VS.kg(+s.kg):'',VS.reps(+s.reps||ds.target,ds.side)];
}
const setSegs=(it,k)=>[VS.serie(k+1,it.sets.length),...targetSegs(it,k)];
const exSegs=it=>[VS.ex(it.n),VS.nSeries(it.sets.length)];

  ss(it){const k=curRow(it);speakSegs([vpick('ss',VZ.ss),VS.ex(it.n),...(k>=0?targetSegs(it,k):[])]);},

  finish(r,lv0,lv1){const m=Math.max(1,Math.round(r.dur/60));
    speakSegs([vpick('fin',VZ.fin),VS.minutes(m),VS.setsDone(r.sets),r.pr.length?VS.prs(r.pr.length):'',
      lv1.lv>lv0.lv?(lv1.ri>lv0.ri?VS.rank(lv1.rank):VS.level(lv1.lv)):'',vname(4)||'',vpick('fe',VZ.finEnd)]);},
  // Rutinas guiadas (intervalos, abdomen, estiramientos, movilidad)
  seqStep(q,st,i){
