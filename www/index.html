<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2f4bff"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><style>@font-face{font-family:"Big Shoulders Display";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"Big Shoulders Display";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Barlow";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2")}</style></head><body><title>Mancuernas</title>

<style>
/* Layout: app móvil de una columna (máx. 560px), pestañas abajo, entrenamiento a pantalla completa. Papel frío, tinta y un azul cobalto de acento; las figuras siguen siendo dibujo a lápiz. */
:root{
  --bg:#f3f4f8; --card:#ffffff; --ink:#10131c; --ink-2:#5b6170; --ink-3:#8b90a0; --rule:#e0e3eb;
  --acc:#2f4bff; --acc-ink:#ffffff; --acc-soft:#e7eaff; --acc-2:#ff6b2c; --good:#0f9d63;
  --far:#d3d6df; --fill-2:#f1f2f6; --paper:var(--card);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabs:64px; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f17;--card:#161a25;--ink:#eef0f6;--ink-2:#a3a9b9;--ink-3:#6f7588;--rule:#252a37;--acc:#6f84ff;--acc-ink:#0c0f17;--acc-soft:#1d2450;--acc-2:#ff8b55;--good:#39d394;--far:#3c4252;--fill-2:#1e2330;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0f17;--card:#161a25;--ink:#eef0f6;--ink-2:#a3a9b9;--ink-3:#6f7588;--rule:#252a37;--acc:#6f84ff;--acc-ink:#0c0f17;--acc-soft:#1d2450;--acc-2:#ff8b55;--good:#39d394;--far:#3c4252;--fill-2:#1e2330;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;margin:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.col{max-width:560px;margin:0 auto;padding-inline:16px}
#view{padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(var(--tabs) + 110px)}
.fade{animation:fin .28s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .col{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabs)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.76rem;color:var(--ink-3);font-weight:600}
.tabs button .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .2s}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .pill{background:var(--acc-soft);color:var(--acc)}

/* comunes */
.eyebrow{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
h1.big{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:2.7rem;line-height:.9;margin:2px 0;letter-spacing:.01em;text-wrap:balance}
h2.sec{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.45rem;margin:26px 0 10px;line-height:1;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec small{font-family:var(--f-body);text-transform:none;font-weight:500;font-size:.85rem;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:12px;font-weight:700;font-size:1.05rem;border:1.5px solid var(--rule);background:var(--card);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.sm{min-height:42px;font-size:.92rem;padding:0 14px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 6px;font-weight:700;font-size:.92rem;line-height:1.15;border-radius:9px;color:var(--ink-2)}
.seg button small{display:block;font-family:var(--f-mono);font-size:.68rem;font-weight:500;margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,19,28,.12)}

/* inicio */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.streak{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--rule);flex:none}
.streak svg{color:var(--acc-2)}
.streak b{font-family:var(--f-mono);font-size:1.1rem}
.streak span{font-size:.75rem;color:var(--ink-2);line-height:1.05}
.weekcard{margin-top:14px;padding:16px;border-radius:var(--r);background:var(--acc);color:var(--acc-ink);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.wring{width:84px;height:84px;position:relative}
.wring svg{width:100%;height:100%;transform:rotate(-90deg)}
.wring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.wring .t b{font-family:var(--f-mono);font-size:1.5rem}
.wring .t span{font-size:.68rem;opacity:.85;margin-top:2px}
.weekcard h3{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.5rem;line-height:1}
.weekcard .mini{display:flex;gap:16px;margin-top:8px;font-size:.85rem;opacity:.92}
.weekcard .mini b{font-family:var(--f-mono);font-size:1rem;display:block}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.week button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 8px;border-radius:12px;background:var(--card);border:1px solid var(--rule)}
.week .l{font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1}
.week .d{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2)}
.week .mk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule)}
.week .mk.on{background:var(--good);border-color:var(--good);color:#fff}
.week .mk svg{width:10px;height:10px}
.week button.today{border-color:var(--ink-3)}
.week button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.week button[aria-pressed="true"] .d{color:var(--card);opacity:.75}
.week button[aria-pressed="true"] .mk:not(.on){border-color:var(--ink-3)}
.dayhd{margin-top:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--acc-soft);color:var(--acc)}
.mode{margin:14px 0 4px}
.exlist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.exrow{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:6px 14px 6px 6px;width:100%;text-align:left}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--fill-2);overflow:hidden;display:block}
.thumb svg{width:100%;height:100%;display:block}
.exrow .nm{font-weight:700;line-height:1.2;min-width:0}
.exrow .ds{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2);margin-top:3px;font-weight:500}
.exrow .chev{color:var(--ink-3);font-size:1.3rem}
.startbar{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px));padding-block:12px 10px;background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:9}
.rest-card{padding:22px 18px;margin-top:18px}
.rest-card p{margin:6px 0 0}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;margin-top:14px;border-color:var(--acc)}
.banner b{display:block}

/* progreso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{padding:12px 12px 10px}
.kpis b{display:block;font-family:var(--f-mono);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpis span{font-size:.76rem;color:var(--ink-2)}
.chart{padding:14px 12px 10px}
.chart .cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px}
.chart .cap b{font-family:var(--f-mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.chart .cap span{font-size:.8rem;color:var(--ink-2)}
.chart svg{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-family:var(--f-mono);font-size:10px}
.chart .bar{fill:var(--acc);opacity:.45;transition:opacity .15s}
.chart .bar.on{opacity:1}
.chart .ln{stroke:var(--acc);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--acc);opacity:.12}
.chart .pt{fill:var(--acc);stroke:var(--card);stroke-width:2}
.chart .pt.on{r:6}
.chart .hit{fill:transparent;cursor:pointer}
.chart .empty{fill:var(--ink-3);font-size:12px;font-family:var(--f-body)}
.selwrap{position:relative;margin:0 4px 4px}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;padding:10px 36px 10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--fill-2);font-weight:600}
.selwrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.badge{padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fill-2);color:var(--ink-3)}
.badge.on .ic{background:var(--acc);color:var(--acc-ink)}
.badge b{font-size:.8rem;line-height:1.15}
.badge span{font-size:.7rem;color:var(--ink-2);font-family:var(--f-mono)}
.prs{list-style:none;padding:0;margin:0}
.prs li{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.prs li:last-child{border-bottom:0}
.prs .v{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.hist summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hist .hd1{font-weight:700}
.hist .hd2{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2)}
.hist .hr{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-mono);font-size:.8rem;text-align:right}
.hist .body{padding:0 14px 12px;border-top:1px dashed var(--rule)}
.empty{padding:24px 16px;text-align:center;color:var(--ink-2)}
.sumlist{list-style:none;padding:0;margin:10px 0 0}
.sumlist li{padding:10px 0;border-bottom:1px solid var(--rule)}
.sumlist li:last-child{border-bottom:0}
.sumlist .sx{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);margin-top:2px}
.prmark{display:inline-block;font-size:.68rem;font-weight:700;color:var(--acc-2);border:1.5px solid var(--acc-2);border-radius:10px;padding:0 6px;margin-left:6px;vertical-align:2px}

/* ajustes */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--rule)}
.set-row:last-child{border-bottom:0}
.set-row .lb{font-weight:600}
.set-row .lb small{display:block;font-weight:400;color:var(--ink-2);font-size:.85rem}
.set-row input{width:46%;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--fill-2);text-align:right;font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;background:var(--rule);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--acc)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.note{font-size:.85rem;color:var(--ink-2);margin-top:12px}

/* sesión */
#session{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sbar{display:flex;align-items:center;gap:12px;padding-block:12px}
.sbar .x{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--card);border:1px solid var(--rule);flex:none}
.prog{flex:1;display:flex;gap:4px;min-width:0}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.prog i.done{background:var(--acc)}
.prog i.cur{background:linear-gradient(90deg,var(--acc) var(--p,0%),var(--rule) var(--p,0%))}
.clock{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem;flex:none;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--rule)}
.stagecard{padding:10px 10px 8px;display:flex;flex-direction:column;align-items:center}
.anim{position:relative;width:min(100%,33vh)}
.anim svg{display:block;width:100%;height:auto}
.anim.two svg{animation:fa 2.6s ease-in-out infinite}
.anim.two svg+svg{position:absolute;inset:0;animation-name:fb}
@keyframes fa{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
@keyframes fb{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.ph{display:flex;gap:8px;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.ph span{padding:3px 8px;border-radius:20px}
.ph.two span:first-child{animation:pa 2.6s ease-in-out infinite}
.ph.two span:last-child{animation:pb 2.6s ease-in-out infinite}
@keyframes pa{0%,38%{background:var(--acc-soft);color:var(--acc)}50%,88%{background:transparent;color:var(--ink-3)}100%{background:var(--acc-soft);color:var(--acc)}}
@keyframes pb{0%,38%{background:transparent;color:var(--ink-3)}50%,88%{background:var(--acc-soft);color:var(--acc)}100%{background:transparent;color:var(--ink-3)}}
@media (prefers-reduced-motion:reduce){.anim.two svg,.ph span{animation:none!important}.anim.two svg+svg{display:none}}
.exname{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:2rem;line-height:.95;margin:14px 0 4px;text-align:center;text-wrap:balance}
.cue{text-align:center;color:var(--ink-2);margin:0 auto;max-width:42ch;font-size:.95rem}
.setline{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:8px;border-radius:4px;background:var(--rule)}
.dots i.on{background:var(--acc)}
.dots i.cur{background:var(--ink-3)}
.target{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.steppers.one{grid-template-columns:1fr}
.stp{border-radius:var(--r);padding:10px 10px 12px;background:var(--card);border:1px solid var(--rule)}
.stp label{display:block;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:center}
.stp .row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px;margin-top:6px}
.stp .row button{height:44px;border-radius:12px;font-size:1.4rem;font-weight:700;background:var(--fill-2)}
.stp .row button:active{background:var(--acc-soft);color:var(--acc)}
.stp input{width:100%;min-width:0;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:1.7rem;border:0;background:transparent;font-variant-numeric:tabular-nums;padding:0}
.last{font-size:.85rem;color:var(--ink-2);text-align:center;margin-top:10px}
.last b{color:var(--ink)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-bottom:20px}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{position:relative;width:min(68vw,250px);aspect-ratio:1;margin:18px auto 8px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--rule)}
.ring .fgc{stroke:var(--acc);transition:stroke-dashoffset .25s linear}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-family:var(--f-mono);font-size:3.4rem;font-variant-numeric:tabular-nums;line-height:1}
.ring .t span{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-top:6px}
.pillrow{display:flex;justify-content:center;gap:10px;margin-top:4px}
.next{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:10px;margin-top:18px}
.next .thumb{width:72px;height:72px}
.warm ul{margin:4px 0 0;padding-left:20px}
.warm li{margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{padding:12px 8px;text-align:center}
.stats b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.76rem;color:var(--ink-2)}
.check{width:76px;height:76px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;margin:28px auto 4px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.prbox{margin-top:14px;padding:14px;border-color:var(--acc-2)}
.prbox h4{margin:0 0 4px;color:var(--acc-2);font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.2rem}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:60;background:var(--acc-2);color:#fff;font-weight:700;padding:10px 16px;border-radius:24px;display:flex;align-items:center;gap:8px;transition:transform .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
#toast.show{transform:translate(-50%,0)}

/* hoja */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(8,10,16,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet .pan{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px}
#sheet h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.7rem;margin:0 0 6px;line-height:1}
#sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}

/* dibujo */
.o{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.i{stroke:var(--card);fill:none;stroke-linecap:round;stroke-linejoin:round}
.thumb .i{stroke:var(--fill-2)}
.thumb .hd,.thumb .tf,.thumb .dbh,.thumb .pf{fill:var(--fill-2)}
.fi{stroke:var(--far);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hd{fill:var(--card);stroke:var(--ink);stroke-width:1.1}
.tf{fill:var(--card);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round}
.dbp{fill:var(--acc)}.dbh{fill:var(--card)}.dbb{stroke:var(--acc);stroke-width:1.4;stroke-linecap:round}
.ln{stroke:var(--ink);stroke-width:.9;fill:none;stroke-linecap:round}
.tk{stroke:var(--ink-3);stroke-width:.45}
.pf{fill:var(--card);stroke:var(--ink);stroke-width:.9}
.hb{fill:url(#hatch);stroke:var(--ink);stroke-width:.9}
.hatch-l{stroke:var(--ink-3);stroke-width:.4}
.mt{fill:var(--fill-2);stroke:var(--ink-3);stroke-dasharray:2 1.6;stroke-width:.6}
.ar{stroke:var(--ink-3);fill:none;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}

<script>
const L={T:28,N:7,R:5,U:13,F:12,TH:19,SH:19,FT:5};
const RD=Math.PI/180;
const P=(o,a,l)=>[o[0]+l*Math.cos(a*RD),o[1]+l*Math.sin(a*RD)];
const ANG=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])/RD;
const DIST=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const fx=n=>(+n).toFixed(1);

function limb(S,l1,l2,s){
  if(!s) return null;
  if(Array.isArray(s)){const e=P(S,s[0],l1*(s[2]??1));return [e,P(e,s[1],l2*(s[3]??1))];}
  const T=s.to, dd=DIST(S,T)||0.01, u=[(T[0]-S[0])/dd,(T[1]-S[1])/dd];
  const d=Math.min(dd,l1+l2-0.01);
  const a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a)), b=s.b||1;
  const e=[S[0]+a*u[0]-b*h*u[1], S[1]+a*u[1]+b*h*u[0]];
  return [e,P(e,ANG(e,T),l2)];
}

function skel(q){
  const v=q.v||'side', p=q.p, t=q.t??-90, ha=q.h??t;
  const neck=P(p,t,L.T*(q.ts??1)), head=P(neck,ha,L.N);
  const down=ANG(neck,p), sc=P(neck,down,2);
  let sh=[sc,sc], hp=[p,p];
  if(v!=='side'){sh=[P(sc,down+90,6),P(sc,down-90,6)];hp=[P(p,down+90,4),P(p,down-90,4)];}
  if(q.sh) sh=sh.map(s=>[s[0],s[1]-q.sh]);
  const arms=[0,1].map(i=>limb(sh[i],L.U,L.F,q.A&&q.A[i]));
  const legs=[0,1].map(i=>limb(hp[i],L.TH,L.SH,q.L&&q.L[i]));
  const fd=v==='side'?[0,0]:v==='front'?[165,15]:[null,null];
  const fa=q.fa||fd;
  const feet=legs.map((lg,i)=>lg&&fa[i]!=null?P(lg[1],fa[i],L.FT):null);
  return {v,p,neck,head,ha,sc,sh,hp,arms,legs,feet};
}

const poly=pts=>'M'+pts.map(p=>fx(p[0])+' '+fx(p[1])).join('L');
const layer=(ds,wo,wi,cls)=>{const d=ds.filter(Boolean).join('');if(!d)return '';
  return `<path d="${d}" class="o" stroke-width="${wo}"/><path d="${d}" class="${cls}" stroke-width="${wi}"/>`;};

function dumbbell(w,type,fore){
  if(type==null) return '';
  if(type==='end') return `<circle cx="${fx(w[0])}" cy="${fx(w[1])}" r="3.3" class="dbp"/><circle cx="${fx(w[0])}" cy="${fx(w[1])}" r="1" class="dbh"/>`;
  const a=type==='perp'?fore+90:type;
  const A=P(w,a,4.8),B=P(w,a+180,4.8);
  let s=`<path d="${poly([A,B])}" class="dbb"/>`;
  for(const sg of [1,-1]){
    const c=P(w,a+(sg>0?0:180),3.7);
    const pts=[P(P(c,a,1.2),a+90,3.2),P(P(c,a,1.2),a-90,3.2),P(P(c,a,-1.2),a-90,3.2),P(P(c,a,-1.2),a+90,3.2)];
    s+=`<path d="${poly(pts)}Z" class="dbp"/>`;
  }
  return s;
}

function fig(q){
  const s=skel(q);let o='';
  const dbs=Array.isArray(q.db)?q.db:[q.db,q.db];
  const arm=i=>s.arms[i]?poly([s.sh[i],...s.arms[i]]):'';
  const leg=i=>s.legs[i]?poly([s.hp[i],...s.legs[i],...(s.feet[i]?[s.feet[i]]:[])]):'';
  const dbAt=i=>s.arms[i]?dumbbell(s.arms[i][1],dbs[i],ANG(s.arms[i][0],s.arms[i][1])):'';
  const head=()=>{let h=`<circle cx="${fx(s.head[0])}" cy="${fx(s.head[1])}" r="${L.R}" class="hd"/>`;
    if(s.v==='side'){const d=s.ha+90;h+=`<path d="${poly([P(s.head,d,L.R),P(s.head,d,L.R+1.7)])}" class="o" stroke-width="1.2"/>`;}
    return h;};
  const LW=[4.2,2.3];
  if(s.v==='side'){
    o+=layer([leg(1),arm(1)],...LW,'fi')+dbAt(1);
    o+=layer([poly([s.sc,s.neck])],3.2,1.4,'i');
    o+=layer([poly([s.p,s.sc])],8,6.2,'i');
    o+=head();
    o+=layer([leg(0)],...LW,'i');
    o+=layer([arm(0)],...LW,'i')+dbAt(0);
  }else{
    o+=layer([leg(0),leg(1)],...LW,'i');
    o+=layer([poly([s.sc,s.neck])],3.2,1.4,'i');
    o+=`<path d="${poly([s.sh[0],s.sh[1],s.hp[1],s.hp[0]])}Z" class="tf"/>`;
    o+=head();
    o+=layer([arm(0),arm(1)],...LW,'i')+dbAt(0)+dbAt(1);
  }
  return o;
}

function props(list,v){
  let o='';
  if(v!=='top'){
    o+=`<path d="M0 92.4H100" class="ln"/>`;
    let t='';for(let x=5;x<100;x+=6)t+=`M${x} 92.9l-2.4 3`;
    o+=`<path d="${t}" class="tk"/>`;
  }
  for(const p of list){
    if(p.k==='chair'||p.k==='bench'){
      const th=p.k==='bench'?3.6:2.6;
      if(p.back==='l') o+=`<path d="M${p.x1+1.4} ${p.y}V${p.y-22}" class="ln" stroke-width="1.8"/>`;
      o+=`<path d="M${p.x1+1.6} ${p.y+th}V92.4M${p.x2-1.6} ${p.y+th}V92.4" class="ln" stroke-width="1.4"/>`;
      o+=`<rect x="${p.x1}" y="${p.y}" width="${p.x2-p.x1}" height="${th}" rx=".6" class="pf"/>`;
    }else if(p.k==='box'){
      o+=`<rect x="${p.x1}" y="${p.y}" width="${p.x2-p.x1}" height="${92.4-p.y}" class="hb"/>`;
    }else if(p.k==='mat'){
      o+=`<rect x="20" y="14" width="60" height="80" rx="3" class="mt"/>`;
    }
  }
  return o;
}

function exSVG(ex){
  const pr=ex.pr||[];
  const frame=(q,dx)=>`<g transform="translate(${dx} 0)"><g filter="url(#rough)">${props(pr,q.v)}${fig(q)}</g></g>`;
  const body=ex.f.length===1?frame(ex.f[0],55)
    :frame(ex.f[0],0)+`<path d="M100.5 42H109M106 39L109 42L106 45" class="ar"/>`+frame(ex.f[1],110);
  return `<svg viewBox="0 -10 210 106" role="img" aria-label="${ex.n}">${body}</svg>`;
}

function frameSVG(ex,i){
  const q=ex.f[Math.min(i,ex.f.length-1)];
  return `<svg viewBox="0 -10 100 106" role="img" aria-label="${ex.n}"><g filter="url(#rough)">${props(ex.pr||[],q.v)}${fig(q)}</g></svg>`;
}

function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}

  const sel=S.tipPt!=null&&S.tipPt<pts.length?S.tipPt:pts.length-1;
  let g='';
  for(let k=0;k<=2;k++){const v=lo+(hi-lo)*k/2,y=Y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${NF.format(Math.round(v*10)/10)}</text>`;}
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
  if(pts.length>1)g+=`<path class="area" d="${line}L${X(pts.length-1)} ${T+ih}L${X(0)} ${T+ih}Z"/><path class="ln" d="${line}"/>`;
  pts.forEach((p,i)=>{g+=`<g data-act="pt" data-v="${i}"><rect class="hit" x="${X(i)-14}" y="${T}" width="28" height="${ih+B}"/><circle class="pt ${i===sel?'on':''}" cx="${X(i)}" cy="${Y(p.v)}" r="${i===sel?6:4}"/></g>`;});
  const fd=ts=>new Date(ts).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  g+=`<text class="ax" x="${X(0)}" y="${H-6}" text-anchor="${pts.length>1?'start':'middle'}">${fd(pts[0].ts)}</text>`;
  if(pts.length>1)g+=`<text class="ax" x="${X(pts.length-1)}" y="${H-6}" text-anchor="end">${fd(pts[pts.length-1].ts)}</text>`;
  const sp=pts[sel];
  return `<div class="cap"><span>${fd(sp.ts)} · mejor serie</span><b>${fmtBest(name,sp.b)}</b></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progreso de ${name} en ${unit}">${g}</svg>`;
}
function achievements(){
  const n=S.history.length, vol=S.history.reduce((a,h)=>a+(h.vol||0),0), st=streak();
  const weeks={};S.history.forEach(h=>{const k=weekStart(h.ts);(weeks[k]=weeks[k]||new Set()).add(h.day);});
  const fullWeek=Object.values(weeks).some(s=>s.size>=6);
  const prs=S.history.reduce((a,h)=>a+((h.pr||[]).length),0);
  return [
    {ic:IC.star,t:'Primer entreno',on:n>=1,p:Math.min(n,1)+'/1'},
    {ic:IC.flame,t:'Racha de 5',on:st>=5,p:Math.min(st,5)+'/5'},
    {ic:IC.cal,t:'Semana completa',on:fullWeek,p:fullWeek?'6/6':Math.max(0,...Object.values(weeks).map(s=>s.size))+'/6'},
    {ic:IC.bolt,t:'10 entrenos',on:n>=10,p:Math.min(n,10)+'/10'},
    {ic:IC.weight,t:'1.000 kg',on:vol>=1000,p:NF.format(Math.min(vol,1000))},
    {ic:IC.trophy,t:'5 récords',on:prs>=5,p:Math.min(prs,5)+'/5'},
    {ic:IC.bolt,t:'30 entrenos',on:n>=30,p:Math.min(n,30)+'/30'},
    {ic:IC.weight,t:'10.000 kg',on:vol>=10000,p:NF.format(Math.min(vol,10000))}
  ];
}
function viewProg(){
  const vol=S.history.reduce((a,h)=>a+(h.vol||0),0), min=Math.round(S.history.reduce((a,h)=>a+h.dur,0)/60);
  const names=[...new Set(S.history.flatMap(h=>(h.ex||[]).map(z=>z.n)))];
  if(!S.chartEx||!names.includes(S.chartEx)) S.chartEx=names[0]||null;
  let h=`<h1 class="big">Progreso</h1>
  <div class="kpis"><div class="card"><b>${S.history.length}</b><span>entrenamientos</span></div><div class="card"><b>${vol>=10000?NF.format(Math.round(vol/1000))+'k':NF.format(vol)}</b><span>kg movidos</span></div><div class="card"><b>${min}</b><span>minutos</span></div></div>
  <h2 class="sec">Kilos por semana <small>últimas 8</small></h2><div class="card chart">${barChart(weeklyVolume())}</div>
  <h2 class="sec">Por ejercicio</h2><div class="card chart">`;
  if(names.length){h+=`<div class="selwrap"><select id="exsel" aria-label="Ejercicio">${names.map(n=>`<option ${n===S.chartEx?'selected':''}>${n}</option>`).join('')}</select></div>${lineChart(S.chartEx)}`;}
  else h+=lineChart('Curl de bíceps');
  h+=`</div><h2 class="sec">Logros</h2><div class="badges">${achievements().map(a=>`<div class="card badge ${a.on?'on':''}"><span class="ic">${a.ic}</span><b>${a.t}</b><span>${a.on?'Logrado':a.p}</span></div>`).join('')}</div>`;
  const prs=names.map(n=>({n,b:bestOf(n,S.history)})).filter(x=>x.b);
  h+=`<h2 class="sec">Récords</h2>`;
  h+=prs.length?`<ul class="card prs">${prs.map(x=>`<li><span>${x.n}</span><span class="v">${fmtBest(x.n,x.b)}</span></li>`).join('')}</ul>`:`<div class="card empty">Tus mejores marcas aparecen aquí después de entrenar.</div>`;
  h+=`<h2 class="sec">Historial</h2>`;
  if(!S.history.length) return h+`<div class="card empty">Aún no hay entrenamientos. Cuando termines el primero aparece aquí con tus pesos y repeticiones.</div>`;
  h+='<ul class="hist">';
  S.history.forEach(x=>{const d=DAYS.find(z=>z.id===x.day)||{t:''};
    const dt=new Date(x.ts).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
    h+=`<li class="card"><details><summary><span class="hd1">${d.t} · ${x.mode==='express'?'exprés':'completa'}</span><span class="hd2">${dt}</span><span class="hr">${Math.round(x.dur/60)} min<br>${x.sets} series</span></summary><div class="body"><ul class="sumlist">`;
    (x.ex||[]).forEach(z=>{h+=`<li><b>${z.n}</b>${(x.pr||[]).includes(z.n)?'<span class="prmark">RÉCORD</span>':''}<div class="sx">${fmtSets(z)}</div></li>`;});
    h+=`</ul><button class="btn sm" style="margin-top:12px" data-act="askdel" data-v="${x.id}">Borrar esta sesión</button></div></details></li>`;});
  return h+'</ul>';
}

function viewAjustes(){
  const st=S.settings;
  const sw=(k,lb,sm)=>`<div class="set-row"><span class="lb">${lb}${sm?`<small>${sm}</small>`:''}</span><button class="sw" data-act="tog" data-v="${k}" aria-pressed="${!!st[k]}" aria-label="${lb}"></button></div>`;

  <h2 class="sec">Tu perfil</h2>
  <div class="card"><div class="set-row"><label class="lb" for="in-name">Nombre</label><input id="in-name" value="${(st.name||'').replace(/"/g,'&quot;')}" maxlength="24" autocomplete="off"></div></div>

  <div class="seg" role="group" aria-label="Descanso">${[45,60,75,90,120].map(s=>`<button data-act="rest" data-v="${s}" aria-pressed="${st.rest===s}">${s} s</button>`).join('')}</div>
  <h2 class="sec">Durante el entrenamiento</h2>
  <div class="card">${sw('warm','Calentamiento al inicio','5 minutos antes del primer ejercicio')}${sw('sound','Sonido','Pitidos al final del descanso')}${sw('vib','Vibración','Al terminar series y descansos')}${sw('wake','Pantalla encendida','El teléfono no se bloquea mientras entrenas')}</div>

  <p class="note">${S.store==='db'?'Tu historial se guarda en tu cuenta.':'Tu historial se guarda en este teléfono.'} Mancuernas v1.0</p>`;

/* ---------- hoja inferior ---------- */
function sheet(html){const s=$('#sheet');s.innerHTML=`<div class="pan" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;s.hidden=false;syncGuard();}
function closeSheet(fromPop){$('#sheet').hidden=true;$('#sheet').innerHTML='';if(!fromPop)syncGuard();}
function infoSheet(name){const e=EXMAP[name];const ds=dose(e);const b=bestOf(name,S.history);
  sheet(`<div class="stagecard">${anim(e)}</div><h3 style="margin-top:10px">${e.n}</h3><div class="target">${e.r}</div><p>${e.c}</p>${b?`<p class="muted">Tu récord: <b>${fmtBest(name,b)}</b></p>`:''}<div class="acts"><button class="btn" data-act="close">Cerrar</button></div>`);}
function askQuit(){sheet(`<h3>¿Salir?</h3><p class="muted">Puedes guardar lo que llevas o dejarlo en pausa para seguir después.</p><div class="acts"><button class="btn pri" data-act="close">Seguir entrenando</button><button class="btn" data-act="quitsave">Terminar y guardar</button><button class="btn" data-act="pause">Pausar y salir</button></div>`);}

/* ---------- sesión ---------- */
function curItem(){return S.live.items[S.live.i];}
function prefill(){
  const L=S.live,it=curItem(),e=EXMAP[it.n],ds=dose(e);
  const prev=it.done.length?it.done[it.done.length-1]:null, last=lastFor(it.n);
  const ref=prev||(last?last[Math.min(it.done.length,last.length-1)]:null);
  L.kg=ref?ref[0]:(isBW(e)?0:5);
  L.reps=ds.timed?ds.timed:(ref?ref[1]:ds.target);
}
function startSession(){
  ensureAudio();
  const p=plan(S.sel,S.settings.mode);
  const best={};p.forEach(x=>{const b=bestOf(x.e.n,S.history);if(b)best[x.e.n]=b;});
  S.live={day:DAYS[S.sel].id,mode:S.settings.mode,t0:Date.now(),items:p.map(x=>({n:x.e.n,sets:x.sets,done:[]})),i:0,phase:S.settings.warm?'warm':'work',until:0,total:0,best,prs:[]};
  prefill();saveLive();openSession();
}
function openSession(){ensureAudio();$('#session').hidden=false;document.body.style.overflow='hidden';wake(true);renderSession();startTick();syncGuard();}
function closeSession(fromPop){$('#session').hidden=true;$('#session').innerHTML='';document.body.style.overflow='';wake(false);stopTick();render();if(!fromPop)syncGuard();}

function progressBar(){const L=S.live;return L.items.map((it,i)=>{const p=Math.round(100*it.done.length/it.sets);return `<i class="${it.done.length>=it.sets?'done':i===L.i?'cur':''}" style="--p:${p}%"></i>`;}).join('');}
function topBar(){return `<div class="sbar"><button class="x" data-act="askquit" aria-label="Salir del entrenamiento">${IC.x}</button><div class="prog">${progressBar()}</div><span class="clock" id="el">${mmss((Date.now()-S.live.t0)/1000)}</span></div>`;}
function ring(rem,total,label){const C=2*Math.PI*88;const off=C*(1-(total?Math.max(0,rem)/total:0));
  return `<div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke-width="12" class="bgc"/><circle id="rg" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-linecap="round" class="fgc" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="t"><b id="cd">${mmss(Math.ceil(rem))}</b><span>${label}</span></div></div>`;}

function renderSession(){
  const L=S.live,el=$('#session');
  if(L.phase==='summary'){el.innerHTML=`<div class="col fade">${viewSummary()}</div>`;return;}
  let h=`<div class="col">${topBar()}`;
  if(L.phase==='warm'){
    const run=L.until>0;const rem=run?(L.until-Date.now())/1000:WARM;
    h+=`<div class="warm fade"><div class="exname">Calentamiento</div><p class="cue">Prepara articulaciones y sube las pulsaciones.</p>${ring(rem,WARM,run?'restante':'5 minutos')}
    <div class="card" style="padding:12px 16px"><ul><li>1 min de saltos o trote en el sitio</li><li>1 min de círculos de brazos</li><li>1 min de sentadillas sin peso</li><li>1 min de zancadas sin peso</li><li>1 min de flexiones con rodillas apoyadas</li></ul></div>
    <div class="actions">${run?'':'<button class="btn pri" data-act="warmgo">Empezar calentamiento</button>'}<button class="btn ${run?'pri':''}" data-act="warmskip">${run?'Terminé, al primer ejercicio':'Saltar calentamiento'}</button></div></div>`;
  }else if(L.phase==='rest'){
    const it=curItem(),e=EXMAP[it.n];const rem=(L.until-Date.now())/1000;
    h+=`<div class="fade"><div class="exname">Descanso</div><p class="cue">Respira y prepara la siguiente serie.</p>${ring(rem,L.total,'restante')}
    <div class="pillrow"><button class="btn sm" data-act="radd" data-v="-15">−15 s</button><button class="btn sm" data-act="radd" data-v="15">+15 s</button></div>
    <div class="card next">${thumb(e)}<div><div class="eyebrow">Sigue · serie ${it.done.length+1} de ${it.sets}</div><b>${e.n}</b></div></div>
    <div class="actions"><button class="btn pri" data-act="rskip">Saltar descanso</button></div></div>`;
  }else{
    const it=curItem(),e=EXMAP[it.n],ds=dose(e),bw=isBW(e),si=it.done.length,timedRun=L.phase==='timed';
    const b=L.best[it.n];
    h+=`<div class="fade"><div class="card stagecard">${anim(e)}</div><div class="exname">${e.n}</div><p class="cue">${e.c}</p>
    <div class="setline"><div class="dots">${Array.from({length:it.sets},(_,k)=>`<i class="${k<si?'on':k===si?'cur':''}"></i>`).join('')}</div><span class="target">Serie ${Math.min(si+1,it.sets)} de ${it.sets} · ${ds.label}</span></div>`;
    if(ds.timed){
      const rem=timedRun?(L.until-Date.now())/1000:ds.timed;
      h+=ring(rem,ds.timed,timedRun?'aguanta':'segundos');
      if(b)h+=`<div class="last">Récord: <b>${fmtBest(it.n,b)}</b></div>`;
      h+=`<div class="actions">${timedRun?'<button class="btn" data-act="tdone">Terminé antes</button>':'<button class="btn pri" data-act="tgo">Iniciar '+ds.timed+' s</button>'}`;
    }else{
      h+=`<div class="steppers ${bw?'one':''}">${bw?'':stepper('kg','Kg por mancuerna',L.kg)}${stepper('reps',ds.side?'Reps por '+ds.side:'Repeticiones',L.reps)}</div>`;
      const last=lastFor(it.n);
      if(last||b)h+=`<div class="last">${last?'Última vez: '+fmtSets({s:last,bw}):''}${last&&b?'<br>':''}${b?'Récord: <b>'+fmtBest(it.n,b)+'</b>':''}</div>`;
      h+=`<div class="actions"><button class="btn pri" data-act="setdone">Serie hecha</button>`;
    }
    h+=`<div class="navrow"><button class="btn sm" data-act="prev" ${L.i===0?'disabled':''}>‹ Anterior</button><button class="btn sm" data-act="skip">${nextOpen(L.i+1)<0?'Terminar':'Saltar ›'}</button></div></div></div>`;
  }
  el.innerHTML=h+'</div>';
}
function stepper(k,lb,val){return `<div class="stp"><label for="in-${k}">${lb}</label><div class="row"><button data-act="step" data-k="${k}" data-v="-1" aria-label="Menos">−</button><input id="in-${k}" inputmode="decimal" value="${val}" data-k="${k}"><button data-act="step" data-k="${k}" data-v="1" aria-label="Más">+</button></div></div>`;}

function nextOpen(from){const L=S.live;for(let j=from;j<L.items.length;j++)if(L.items[j].done.length<L.items[j].sets)return j;return -1;}
function goRest(){const L=S.live;L.phase='rest';L.total=S.settings.rest;L.until=Date.now()+S.settings.rest*1000;L.lastBeep=null;}
function recordSet(kg,reps){
  const L=S.live,it=curItem(),s=[kg,reps];it.done.push(s);buzz(40);
  const b=L.best[it.n];
  if(b&&better(it.n,s,b)){L.best[it.n]=s;if(!L.prs.includes(it.n))L.prs.push(it.n);toast(IC.trophy+' Nuevo récord: '+fmtBest(it.n,s));beep(990,.12);buzz(120);}
  else if(!b){L.best[it.n]=s;}
  if(it.done.length<it.sets){goRest();}
  else{const n=nextOpen(L.i+1);if(n<0){const m=nextOpen(0);if(m<0){finish();return;}L.i=m;}else L.i=n;prefill();goRest();}
  saveLive();renderSession();
}
function finish(){
  const L=S.live;
  const ex=L.items.filter(it=>it.done.length).map(it=>{const e=EXMAP[it.n];return {n:it.n,bw:isBW(e),t:!!dose(e).timed,s:it.done};});
  if(!ex.length){S.live=null;saveLive();closeSession();return;}
  const sets=ex.reduce((a,x)=>a+x.s.length,0);
  const vol=ex.reduce((a,x)=>a+(x.bw||x.t?0:x.s.reduce((b,s)=>b+s[0]*s[1],0)),0);
  const rec={id:'mc-'+Date.now(),ts:L.t0,day:L.day,mode:L.mode,dur:Math.round((Date.now()-L.t0)/1000),sets,vol:Math.round(vol),ex,pr:L.prs.slice()};
  addSession(rec);S.summary=rec;L.phase='summary';LS.del('mc-live');
  beep(660,.15);setTimeout(()=>beep(880,.3),180);buzz(300);wake(false);
  renderSession();
}
function viewSummary(){
  const r=S.summary,d=DAYS.find(z=>z.id===r.day);
  return `<div class="check"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
  <div class="exname">¡Entrenamiento listo!</div><p class="cue">${d.d} · ${d.t} · racha de ${streak()} ${streak()===1?'día':'días'}</p>
  <div class="stats"><div class="card"><b>${Math.max(1,Math.round(r.dur/60))}</b><span>minutos</span></div><div class="card"><b>${r.sets}</b><span>series</span></div><div class="card"><b>${NF.format(r.vol)}</b><span>kg movidos</span></div></div>
  ${r.pr.length?`<div class="card prbox"><h4>${r.pr.length===1?'Nuevo récord':r.pr.length+' récords nuevos'}</h4>${r.pr.map(n=>`<div>${n}: <b>${fmtBest(n,bestOf(n,[r]))}</b></div>`).join('')}</div>`:''}
  <div class="card" style="padding:4px 14px;margin-top:14px"><ul class="sumlist">${r.ex.map(z=>`<li><b>${z.n}</b><div class="sx">${fmtSets(z)}</div></li>`).join('')}</ul></div>
  <div class="actions" style="margin-bottom:24px"><button class="btn pri" data-act="sumok">Listo</button></div>`;
}

/* ---------- reloj ---------- */
let TK=null;
function startTick(){stopTick();TK=setInterval(tick,250);}
function stopTick(){if(TK)clearInterval(TK);TK=null;}
function tick(){
  const L=S.live;if(!L||L.phase==='summary')return;
  const el=$('#el');if(el)el.textContent=mmss((Date.now()-L.t0)/1000);
  const timedPh=L.phase==='rest'||L.phase==='timed'||(L.phase==='warm'&&L.until>0);
  if(!timedPh)return;
  const rem=(L.until-Date.now())/1000;
  const total=L.phase==='warm'?WARM:L.phase==='timed'?dose(EXMAP[curItem().n]).timed:L.total;
  const cd=$('#cd'),rg=$('#rg');
  if(cd)cd.textContent=mmss(Math.ceil(rem));
  if(rg){const C=2*Math.PI*88;rg.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,rem)/total)).toFixed(1));}
  const sec=Math.ceil(rem);
  if(sec<=3&&sec>0&&L.lastBeep!==sec){L.lastBeep=sec;beep(880,.12);buzz(30);}
  if(rem<=0){
    beep(1320,.45);buzz(400);
    if(L.phase==='timed'){recordSet(0,dose(EXMAP[curItem().n]).timed);return;}
    L.phase='work';L.until=0;saveLive();renderSession();
  }
}

/* ---------- eventos ---------- */
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.matches('#session input[data-k]')&&S.live){const v=parseFloat(String(t.value).replace(',','.'));if(!isNaN(v))S.live[t.dataset.k]=v;saveLive();}
  else if(t.id==='in-name'){S.settings.name=t.value.trim();saveSettings();}});
document.addEventListener('change',ev=>{if(ev.target.id==='exsel'){S.chartEx=ev.target.value;S.tipPt=null;render();}});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b){if(ev.target.id==='sheet')closeSheet();return;}
  const a=b.dataset.act,v=b.dataset.v,L=S.live;
  switch(a){
    case 'tab':S.tab=v;S.tipBar=null;S.tipPt=null;render();window.scrollTo(0,0);break;
    case 'day':S.sel=+v;render();break;
    case 'mode':S.settings.mode=v;saveSettings();render();break;
    case 'info':infoSheet(v);break;
    case 'close':closeSheet();break;
    case 'bar':S.tipBar=+v;render();break;
    case 'pt':S.tipPt=+v;render();break;
    case 'start':if(S.live){sheet(`<h3>Tienes uno en pausa</h3><p class="muted">¿Sigues el entrenamiento anterior o empiezas este?</p><div class="acts"><button class="btn pri" data-act="resume">Seguir el anterior</button><button class="btn" data-act="restart">Empezar este</button><button class="btn" data-act="close">Cancelar</button></div>`);}else startSession();break;
    case 'restart':closeSheet();S.live=null;startSession();break;
    case 'resume':closeSheet();if(S.live){if(S.live.phase==='timed'){S.live.phase='work';S.live.until=0;}openSession();}break;
    case 'discard':S.live=null;saveLive();render();break;
    case 'rest':S.settings.rest=+v;saveSettings();render();break;
    case 'tog':S.settings[v]=!S.settings[v];saveSettings();render();break;
    case 'askdel':sheet(`<h3>¿Borrar sesión?</h3><p class="muted">Se quita del historial y no se puede recuperar.</p><div class="acts"><button class="btn pri" data-act="del" data-v="${v}">Borrar</button><button class="btn" data-act="close">Cancelar</button></div>`);break;
    case 'del':delSession(v);closeSheet();render();break;
    case 'askwipe':sheet(`<h3>¿Borrar todo?</h3><p class="muted">Se borran tu historial, récords y logros. No se puede deshacer.</p><div class="acts"><button class="btn pri" data-act="wipe">Borrar todo</button><button class="btn" data-act="close">Cancelar</button></div>`);break;
    case 'wipe':S.history.slice().forEach(h=>delSession(h.id));closeSheet();render();toast('Datos borrados');break;
    case 'askquit':askQuit();break;
    case 'quitsave':closeSheet();finish();break;
    case 'pause':closeSheet();if(L&&L.phase==='timed'){L.phase='work';L.until=0;}saveLive();closeSession();break;
    case 'sumok':S.live=null;S.summary=null;saveLive();S.tab='hoy';closeSession();break;
    case 'warmgo':ensureAudio();L.until=Date.now()+WARM*1000;L.lastBeep=null;saveLive();renderSession();break;
    case 'warmskip':L.phase='work';L.until=0;saveLive();renderSession();break;
    case 'radd':L.until+=(+v)*1000;L.total=Math.max(L.total+(+v),1);if(L.until<Date.now()+1000)L.until=Date.now()+1000;saveLive();tick();break;
    case 'rskip':L.phase='work';L.until=0;saveLive();renderSession();break;
    case 'step':{const k=b.dataset.k;L[k]=Math.max(0,Math.round(((+L[k]||0)+(+v))*10)/10);const inp=$('#in-'+k);if(inp)inp.value=L[k];saveLive();break;}
    case 'setdone':ensureAudio();recordSet(+L.kg||0,Math.max(0,Math.round(+L.reps||0)));break;
    case 'tgo':ensureAudio();L.phase='timed';L.until=Date.now()+dose(EXMAP[curItem().n]).timed*1000;L.lastBeep=null;saveLive();renderSession();break;
    case 'tdone':{const ds=dose(EXMAP[curItem().n]);const held=Math.round(ds.timed-(L.until-Date.now())/1000);recordSet(0,Math.max(1,held));break;}
    case 'prev':if(L.i>0){L.i--;L.phase='work';L.until=0;prefill();saveLive();renderSession();}break;
    case 'skip':{const n=nextOpen(L.i+1);if(n<0){finish();}else{L.i=n;L.phase='work';L.until=0;prefill();saveLive();renderSession();}break;}
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

render();
initDb();
})();
</script>
