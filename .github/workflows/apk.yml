name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "app-src/audio/**"
      - ".github/workflows/audio.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Marcar número de versión
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Compilar
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Mostrar error
        if: failure()
        run: |
          msg=$( (grep -A25 "What went wrong" build.log || tail -40 build.log) | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle::$msg"

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Mancuernas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mancuernas
          path: Mancuernas.apk

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app Mancuernas.apk --title "Mancuernas v1.0.${{ github.run_number }}" --notes "Descarga Mancuernas.apk desde tu celular e instálala."
