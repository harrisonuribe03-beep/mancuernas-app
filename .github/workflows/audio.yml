name: Generar audio

# Genera la voz del coach (voz neuronal colombiana) y descarga los sonidos reales.
# Se corre a mano desde la pestaña Actions o con la API; deja los archivos en app-src/audio/out.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Qué generar: prueba, voz, sonidos, verificar, bajar o todo"
        default: todo
      data:
        description: "Datos extra (para bajar: líneas nombre|url)"
        default: ""

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Herramientas
        run: |
          pip install edge-tts
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1

      - name: Generar y publicar en la rama audio-<tarea>
        run: bash app-src/audio/ci.sh "${{ inputs.task }}" "${{ github.repository }}" "${{ github.token }}"
        env:
          DATA: ${{ inputs.data }}
